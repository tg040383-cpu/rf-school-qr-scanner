<script>


/*************************************************
 * GAS API
 *************************************************/

const GAS_API =
'https://script.google.com/a/macros/mail.rfes.tyc.edu.tw/s/AKfycbxVyxRnr4i071HzDjXZ43HL_LVbkqZgxWkTgdy8u8_lSwq5H2HsD_Qj-MSwW_spozcE/exec';


/*************************************************
 * 系統變數
 *************************************************/

let teacherId = '';

let token = '';

let scanner = null;

let scannerRunning = false;

let scanLocked = false;

let student = null;

let rewards = [];

let selectedCategory = '';

let selectedReward = null;


/*************************************************
 * 讀取 URL
 *************************************************/

function getUrlParams() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  teacherId =
    params.get(
      'teacher'
    ) || '';


  token =
    params.get(
      'token'
    ) || '';

}


/*************************************************
 * 初始化
 *************************************************/

document.addEventListener(
  'DOMContentLoaded',
  function() {

    getUrlParams();


    if (
      !teacherId ||
      !token
    ) {

      showFatal(
        '缺少 Scanner Token。<br><br>' +
        '請回到教師積點系統重新點擊「掃描學生 QR Code」。'
      );

      return;

    }


    api(
      'ping',
      {},
      function(result) {

        if (
          !result.success
        ) {

          showFatal(
            result.message ||
            'API 無法連線'
          );

          return;

        }


        document
          .getElementById(
            'loadingPage'
          )
          .classList
          .add('hidden');


        document
          .getElementById(
            'scannerPage'
          )
          .classList
          .remove('hidden');


        /*
         * 不自動開相機。
         *
         * iPhone Chrome 對使用者手勢
         * 啟動相機最穩定。
         */

        setStatus(
          '請按「啟動／重新啟動相機」'
        );

      }
    );

  }
);


/*************************************************
 * API JSONP
 *************************************************/

function api(
  action,
  params,
  callback
) {

  const callbackName =
    'rfCallback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  const script =
    document.createElement(
      'script'
    );


  const query =
    new URLSearchParams();


  query.set(
    'api',
    '1'
  );


  query.set(
    'action',
    action
  );


  query.set(
    'teacher',
    teacherId
  );


  query.set(
    'token',
    token
  );


  query.set(
    'callback',
    callbackName
  );


  Object.keys(
    params || {}
  ).forEach(
    function(key) {

      query.set(
        key,
        params[key]
      );

    }
  );


  let finished = false;


  window[callbackName] =
    function(result) {

      finished = true;


      try {

        callback(
          result
        );

      } finally {

        delete window[
          callbackName
        ];

        script.remove();

      }

    };


  script.onerror =
    function() {

      if (finished) {

        return;

      }


      delete window[
        callbackName
      ];


      script.remove();


      callback({

        success: false,

        message:
          '無法連線至 Google Apps Script。'

      });

    };


  script.src =
    GAS_API +
    '?' +
    query.toString();


  document
    .body
    .appendChild(
      script
    );

}


/*************************************************
 * 相機錯誤說明
 *************************************************/

function cameraErrorMessage(
  error
) {

  if (!error) {

    return '未知相機錯誤';

  }


  const name =
    error.name || '';


  if (
    name ===
    'NotAllowedError'
  ) {

    return (
      '❌ 相機權限被拒絕。<br><br>' +

      '請到 iPhone：<br>' +

      '設定 → 隱私權與安全性 → 相機 → Chrome → 開啟<br><br>' +

      '然後重新回到本頁。'
    );

  }


  if (
    name ===
    'NotFoundError'
  ) {

    return (
      '❌ 找不到相機。<br><br>' +
      '請確認 iPhone 相機正常。'
    );

  }


  if (
    name ===
    'NotReadableError'
  ) {

    return (
      '❌ 相機目前被其他程式使用。<br><br>' +
      '請關閉其他使用相機的 App 後再試。'
    );

  }


  if (
    name ===
    'SecurityError'
  ) {

    return (
      '❌ 瀏覽器安全限制。<br><br>' +
      '請確認目前網址是 HTTPS。'
    );

  }


  if (
    name ===
    'AbortError'
  ) {

    return (
      '❌ 相機啟動被中止，請再按一次啟動相機。'
    );

  }


  return (
    '❌ 相機無法啟用。<br><br>' +
    '錯誤：' +
    escapeHtml(
      name
    ) +
    '<br>' +
    escapeHtml(
      error.message || ''
    )
  );

}


/*************************************************
 * 啟動相機
 *************************************************/

async function startCamera() {

  clearCameraError();


  if (
    !window.isSecureContext
  ) {

    showCameraError(
      '❌ 目前不是安全 HTTPS 網頁。<br><br>' +
      '請確認網址是：<br>' +
      'https://tg040383-cpu.github.io/...'
    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showCameraError(
      '❌ 此瀏覽器不支援手機相機 API。<br><br>' +
      '請使用最新版 iPhone Chrome。'
    );

    return;

  }


  await stopCamera();


  scanLocked = false;


  setStatus(
    '正在啟動相機…'
  );


  try {

    /*
     * 先直接測試相機權限。
     *
     * 這一步非常重要。
     */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: 'environment'
            }

          },

          audio: false

        });


    /*
     * 測試成功後立即關閉。
     * html5-qrcode 接手真正掃描。
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          {
            ideal:
              'environment'
          }
      },

      {

        fps: 10,

        qrbox:
          function(
            width,
            height
          ) {

            const size =
              Math.min(
                width,
                height
              ) * 0.70;


            return {

              width:
                Math.floor(
                  size
                ),

              height:
                Math.floor(
                  size
                )

            };

          },

        aspectRatio:
          1.0,

        disableFlip:
          false

      },

      function(decodedText) {

        onScanSuccess(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * 不要一直顯示掃描失敗。
         * QR 尚未進入畫面時這是正常的。
         */

      }

    );


    scannerRunning =
      true;


    setStatus(
      '📷 相機已啟動，請將學生 QR Code 對準框框'
    );


  } catch (error) {

    scannerRunning =
      false;


    showCameraError(
      cameraErrorMessage(
        error
      )
    );

  }

}


/*************************************************
 * 停止相機
 *************************************************/

async function stopCamera() {

  if (
    scanner &&
    scannerRunning
  ) {

    try {

      await scanner.stop();

    } catch (e) {

    }

  }


  if (scanner) {

    try {

      await scanner.clear();

    } catch (e) {

    }

  }


  scanner = null;

  scannerRunning =
    false;

}


/*************************************************
 * 掃描成功
 *************************************************/

async function onScanSuccess(
  decodedText
) {

  if (
    scanLocked
  ) {

    return;

  }


  scanLocked = true;


  await stopCamera();


  setStatus(
    '正在讀取學生資料…'
  );


  api(
    'student',
    {
      qr:
        decodedText
    },
    function(result) {

      if (
        !result.success
      ) {

        alert(
          result.message ||
          '找不到學生'
        );


        scanLocked =
          false;


        showScanner();


        return;

      }


      student =
        result.student;


      showStudent();

    }
  );

}


/*************************************************
 * 顯示學生
 *************************************************/

function showStudent() {

  hideAll();


  document
    .getElementById(
      'studentPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'studentClass'
    )
    .innerText =
    student.className +
    '　' +
    student.seatNo +
    '號';


  document
    .getElementById(
      'studentName'
    )
    .innerText =
    student.name;


  document
    .getElementById(
      'studentPoints'
    )
    .innerText =
    student.points +
    ' 點';


  document
    .getElementById(
      'studentLevel'
    )
    .innerText =
    student.level;


  document
    .getElementById(
      'studentMessage'
    )
    .innerText =
    '已成功讀取學生資料。';

}


/*************************************************
 * 顯示類別
 *************************************************/

function showCategories() {

  hideAll();


  document
    .getElementById(
      'categoryPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'categoryStudent'
    )
    .innerText =
    student.className +
    '　' +
    student.name;


  /*
   * 每次進入都重新取得獎勵。
   */

  api(
    'rewards',
    {},
    function(result) {

      if (
        !result.success
      ) {

        alert(
          result.message
        );

        return;

      }


      rewards =
        result.rewards || [];


      renderCategories();

    }
  );

}


/*************************************************
 * 類別
 *************************************************/

function renderCategories() {

  const categories =
    [
      ...new Set(
        rewards.map(
          function(item) {

            return item.category;

          }
        )
      )
    ];


  const icons = {

    '品德': '🌱',

    '學習': '📚',

    '服務': '🤝',

    '整潔': '🧹',

    '安全': '🛡️',

    '榮譽': '🏆'

  };


  const grid =
    document
      .getElementById(
        'categoryGrid'
      );


  grid.innerHTML = '';


  categories.forEach(
    function(category) {

      const button =
        document.createElement(
          'button'
        );


      button.className =
        'category';


      button.innerHTML =

        (icons[category] || '⭐') +

        '<br><strong>' +

        escapeHtml(
          category
        ) +

        '</strong>';


      button.onclick =
        function() {

          showRewards(
            category
          );

        };


      grid.appendChild(
        button
      );

    }
  );

}


/*************************************************
 * 顯示獎勵
 *************************************************/

function showRewards(
  category
) {

  selectedCategory =
    category;


  hideAll();


  document
    .getElementById(
      'rewardPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'rewardTitle'
    )
    .innerText =
    category +
    '｜選擇行為';


  const list =
    document
      .getElementById(
        'rewardList'
      );


  list.innerHTML = '';


  rewards

    .filter(
      function(item) {

        return (
          item.category ===
          category
        );

      }
    )

    .forEach(
      function(item) {

        const button =
          document.createElement(
            'button'
          );


        button.className =
          'reward';


        button.innerHTML =

          '<span class="reward-points">' +

          '+' +
          escapeHtml(
            item.points
          ) +

          '</span>' +

          '<strong>' +

          escapeHtml(
            item.name
          ) +

          '</strong>' +

          '<br>' +

          '<small>' +

          escapeHtml(
            item.description || ''
          ) +

          '</small>';


        button.onclick =
          function() {

            selectReward(
              item
            );

          };


        list.appendChild(
          button
        );

      }
    );

}


/*************************************************
 * 選擇獎勵
 *************************************************/

function selectReward(
  item
) {

  selectedReward =
    item;


  hideAll();


  document
    .getElementById(
      'confirmPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'confirmStudent'
    )
    .innerText =
    student.name;


  document
    .getElementById(
      'confirmReward'
    )
    .innerText =
    item.name;


  document
    .getElementById(
      'confirmPoints'
    )
    .innerText =
    '+' +
    item.points +
    ' 點';


  document
    .getElementById(
      'remark'
    )
    .value = '';

}


/*************************************************
 * 送出
 *************************************************/

function submitPoint() {

  if (
    !student ||
    !selectedReward
  ) {

    alert(
      '資料不完整'
    );

    return;

  }


  const button =
    document
      .getElementById(
        'submitBtn'
      );


  button.disabled =
    true;


  button.innerText =
    '送出中…';


  api(
    'addPoint',
    {

      studentId:
        student.id,

      rewardId:
        selectedReward.id,

      remark:
        document
          .getElementById(
            'remark'
          )
          .value
          .trim()

    },
    function(result) {

      button.disabled =
        false;


      button.innerText =
        '✓ 確認送出';


      if (
        !result.success
      ) {

        alert(
          '加點失敗：\n' +
          result.message
        );

        return;

      }


      showSuccess(
        result
      );

    }
  );

}


/*************************************************
 * 成功
 *************************************************/

function showSuccess(
  result
) {

  hideAll();


  document
    .getElementById(
      'successPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'successStudent'
    )
    .innerText =
    result.student.name;


  document
    .getElementById(
      'successAdd'
    )
    .innerText =
    '+' +
    result.reward.points +
    ' 點';


  document
    .getElementById(
      'successTotal'
    )
    .innerText =
    result.totalPoints +
    ' 點';


  document
    .getElementById(
      'successLevel'
    )
    .innerText =
    result.level;

}


/*************************************************
 * 返回 Scanner
 *************************************************/

function backToScanner() {

  student = null;

  selectedReward = null;

  selectedCategory = '';

  scanLocked = false;


  hideAll();


  document
    .getElementById(
      'scannerPage'
    )
    .classList
    .remove('hidden');


  setStatus(
    '請按「啟動／重新啟動相機」'
  );

}


/*************************************************
 * 返回獎勵
 *************************************************/

function showRewards() {

  showRewards(
    selectedCategory
  );

}


/*************************************************
 * 顯示 Scanner
 *************************************************/

function showScanner() {

  hideAll();


  document
    .getElementById(
      'scannerPage'
    )
    .classList
    .remove('hidden');


  setStatus(
    '請按「啟動／重新啟動相機」'
  );

}


/*************************************************
 * 隱藏全部
 *************************************************/

function hideAll() {

  [

    'loadingPage',

    'scannerPage',

    'studentPage',

    'categoryPage',

    'rewardPage',

    'confirmPage',

    'successPage'

  ].forEach(
    function(id) {

      document
        .getElementById(id)
        .classList
        .add('hidden');

    }
  );

}


/*************************************************
 * 相機狀態
 *************************************************/

function setStatus(
  message
) {

  document
    .getElementById(
      'scannerStatus'
    )
    .innerText =
    message;

}


/*************************************************
 * 相機錯誤
 *************************************************/

function showCameraError(
  message
) {

  const box =
    document
      .getElementById(
        'cameraError'
      );


  box.innerHTML =
    message;


  box.classList
    .remove('hidden');


  setStatus(
    '相機啟動失敗'
  );

}


/*************************************************
 * 清除錯誤
 *************************************************/

function clearCameraError() {

  document
    .getElementById(
      'cameraError'
    )
    .classList
    .add('hidden');

}


/*************************************************
 * 系統錯誤
 *************************************************/

function showFatal(
  message
) {

  document
    .getElementById(
      'loadingPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'loadingMessage'
    )
    .innerHTML =
    '<div class="danger">' +
    message +
    '</div>';

}


/*************************************************
 * HTML 安全
 *************************************************/

function escapeHtml(
  value
) {

  return String(
    value == null
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/*************************************************
 * 離開頁面時關閉相機
 *************************************************/

window.addEventListener(
  'pagehide',
  function() {

    stopCamera();

  }
);

</script>
