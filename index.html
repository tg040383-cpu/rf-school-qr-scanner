<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>
瑞豐國小｜QR Code 掃描器
</title>

<style>

* {
box-sizing: border-box;
-webkit-tap-highlight-color: transparent;
}

html,
body {
margin: 0;
padding: 0;
width: 100%;
min-height: 100%;
background: #111;
font-family:
-apple-system,
BlinkMacSystemFont,
"Noto Sans TC",
"PingFang TC",
"Microsoft JhengHei",
sans-serif;
}

body {
color: white;
}

.header {
padding: 18px;
text-align: center;
background:
linear-gradient(
135deg,
#1f4e78,
#2e75b6
);
}

.header h1 {
margin: 0;
font-size: 21px;
}

.header p {
margin: 5px 0 0;
font-size: 13px;
}

.container {
width: 100%;
max-width: 600px;
margin: auto;
padding: 14px;
}

.card {
background: #1e1e1e;
border-radius: 18px;
padding: 16px;
margin-bottom: 14px;
}

#reader {
width: 100%;
overflow: hidden;
border-radius: 16px;
background: #000;
}

video {
width: 100% !important;
height: auto !important;
display: block;
}

button {
width: 100%;
min-height: 52px;
border: 0;
border-radius: 14px;
font-size: 17px;
font-weight: 700;
margin-top: 10px;
}

.primary {
background: #2e75b6;
color: white;
}

.success {
background: #43a047;
color: white;
}

.secondary {
background: #424242;
color: white;
}

.danger {
background: #c62828;
color: white;
}

.center {
text-align: center;
}

.student-name {
font-size: 28px;
font-weight: 800;
margin: 12px 0;
}

.points {
font-size: 40px;
font-weight: 800;
color: #90caf9;
}

.reward {
background: #333;
padding: 15px;
border-radius: 14px;
margin-top: 10px;
text-align: left;
}

.reward strong {
font-size: 17px;
}

.hidden {
display: none !important;
}

.status {
padding: 12px;
border-radius: 12px;
background: #263238;
margin-top: 10px;
font-size: 14px;
line-height: 1.6;
}

.loading {
text-align: center;
padding: 20px;
}

</style>

</head>


<body>


<div class="header">

<h1>
📷 瑞豐國小 QR Code 掃描器
</h1>

<p>
V1.4.1 iPhone Chrome 穩定版
</p>

</div>


<div class="container">


<!-- 啟動 -->

<div id="startPage">

<div class="card center">

<div style="font-size:60px">
📷
</div>

<h2>
準備掃描學生 QR Code
</h2>

<p>
請允許 Chrome 使用相機。
</p>

<div class="status">

⚠️ 如果第一次使用：

1. 按下「啟用相機」

2. Chrome 出現相機權限時選擇「允許」

3. 將學生 QR Code 放入框內

</div>

<button
class="primary"
onclick="startCamera()">

📷 啟用相機

</button>

</div>

</div>


<!-- Scanner -->

<div
id="scannerPage"
class="hidden">

<div class="card">

<div
id="reader">
</div>

<div
id="status"
class="status">

正在準備相機……

</div>

<button
class="danger"
onclick="stopCamera()">

⏹ 停止相機

</button>

</div>

</div>


<!-- Student -->

<div
id="studentPage"
class="hidden">

<div class="card center">

<div>
🎓 學生資料
</div>

<div
id="studentClass">
</div>

<div
id="studentName"
class="student-name">
</div>

<div
id="studentPoints"
class="points">
</div>

<div
id="studentLevel">
</div>

<button
class="success"
onclick="goBackToGAS()">

✓ 返回教師積點頁面

</button>

<button
class="primary"
onclick="scanAgain()">

📷 再掃一位學生

</button>

</div>

</div>


</div>


<script>

/*************************************************
 * 設定
 *************************************************/

const GAS_URL =
'https://script.google.com/a/macros/mail.rfes.tyc.edu.tw/s/AKfycbxVyxRnr4i071HzDjXZ43HL_LVbkqZgxWkTgdy8u8_lSwq5H2HsD_Qj-MSwW_spozcE/exec';


const params =
new URLSearchParams(
window.location.search
);


const teacher =
params.get('teacher') || '';


const token =
params.get('token') || '';


let stream = null;

let scanning = false;

let scanTimer = null;

let detector = null;


/*************************************************
 * 初始化
 *************************************************/

document.addEventListener(
'DOMContentLoaded',
function() {

if (!teacher || !token) {

setStatus(
'Scanner 連線資訊不完整，請從教師積點頁面重新開啟。'
);

return;

}

setStatus(
'已取得教師驗證資訊，請按「啟用相機」。'
);

}
);


/*************************************************
 * Status
 *************************************************/

function setStatus(text) {

const el =
document.getElementById(
'status'
);

if (el) {
el.innerText = text;
}

}


/*************************************************
 * 啟用相機
 *************************************************/

async function startCamera() {

if (!teacher || !token) {

alert(
'缺少教師驗證資訊，請重新從教師頁面開啟。'
);

return;

}


if (!window.isSecureContext) {

alert(
'目前不是 HTTPS 安全連線。\n\n請確認使用 GitHub Pages 網址。'
);

return;

}


if (
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
) {

alert(
'此瀏覽器不支援相機功能。請使用最新版 iPhone Chrome。'
);

return;

}


try {

stopCamera();


document
.getElementById('startPage')
.classList
.add('hidden');


document
.getElementById('studentPage')
.classList
.add('hidden');


document
.getElementById('scannerPage')
.classList
.remove('hidden');


setStatus(
'正在要求相機權限……'
);


/*************************************************
 * iPhone Chrome 建議設定
 *************************************************/

stream =
await navigator.mediaDevices.getUserMedia({

video: {

facingMode: {
ideal: 'environment'
},

width: {
ideal: 1280
},

height: {
ideal: 720
}

},

audio: false

});


/*************************************************
 * 建立 Video
 *************************************************/

const reader =
document.getElementById(
'reader'
);

reader.innerHTML = '';


const video =
document.createElement(
'video'
);

video.id = 'cameraVideo';

video.setAttribute(
'autoplay',
''
);

video.setAttribute(
'playsinline',
''
);

video.setAttribute(
'muted',
''
);

video.muted = true;

reader.appendChild(video);


video.srcObject =
stream;


await video.play();


setStatus(
'📷 相機已啟用，請將學生 QR Code 對準畫面。'
);


/*************************************************
 * BarcodeDetector
 *************************************************/

if (
'BarcodeDetector'
in window
) {

try {

detector =
new BarcodeDetector({
formats: ['qr_code']
});

} catch (e) {

detector = null;

}

}


scanning = true;


/*************************************************
 * 開始掃描
 *************************************************/

scanLoop(video);

} catch (error) {

console.error(error);

stopCamera();

document
.getElementById('startPage')
.classList
.remove('hidden');

document
.getElementById('scannerPage')
.classList
.add('hidden');


let message =
'無法啟用相機。';


if (
error &&
error.name ===
'NotAllowedError'
) {

message +=
'\n\n請到 iPhone：設定 → Chrome → 相機 → 開啟。';

} else if (
error &&
error.name ===
'NotFoundError'
) {

message +=
'\n\n找不到可使用的相機。';

} else if (
error &&
error.name ===
'NotReadableError'
) {

message +=
'\n\n相機可能正在被其他 App 使用。';

} else if (
error &&
error.name ===
'SecurityError'
) {

message +=
'\n\n瀏覽器安全性限制了相機。';

} else {

message +=
'\n\n錯誤：' +
(error.message || error);

}


alert(message);

}

}


/*************************************************
 * 掃描 Loop
 *************************************************/

async function scanLoop(video) {

if (!scanning) {
return;
}


if (
detector &&
video.readyState >= 2
) {

try {

const codes =
await detector.detect(video);


if (codes.length > 0) {

const value =
codes[0].rawValue;

if (value) {

scanning = false;

await handleQR(value);

return;

}

}

} catch (error) {

console.log(
'BarcodeDetector:',
error
);

}

}


scanTimer =
setTimeout(
function() {

scanLoop(video);

},
250
);

}


/*************************************************
 * QR 處理
 *************************************************/

async function handleQR(qrValue) {

setStatus(
'🔍 已讀取 QR Code，正在查詢學生……'
);


stopCamera();


/*************************************************
 * 如果 QR 本身是網址
 *************************************************/

let qrId =
qrValue.trim();


try {

const url =
new URL(qrId);


/*
 * 支援：
 *
 * ?qr=XXXX
 * ?student=XXXX
 */

qrId =
url.searchParams.get('qr') ||
url.searchParams.get('student') ||
qrId;

} catch (e) {

}


/*************************************************
 * JSONP 查詢 GAS
 *************************************************/

jsonp(
'student',
{
token: token,
qr: qrId
},
function(result) {

if (!result.success) {

alert(
result.message ||
'找不到學生資料。'
);

document
.getElementById('startPage')
.classList
.remove('hidden');

return;

}


showStudent(
result.student
);

}
);

}


/*************************************************
 * JSONP
 *************************************************/

function jsonp(
action,
params,
callback
) {

const callbackName =
'rfJsonp_' +
Date.now() +
'_' +
Math.floor(
Math.random() * 100000
);


window[callbackName] =
function(data) {

try {

callback(data);

} finally {

delete window[callbackName];

if (script.parentNode) {
script.parentNode.removeChild(
script
);
}

}

};


const query = {

api: '1',

action: action,

callback:
callbackName,

...params

};


const qs =
Object.keys(query)
.map(function(key) {

return (
encodeURIComponent(key) +
'=' +
encodeURIComponent(
query[key]
)
);

})
.join('&');


const script =
document.createElement(
'script'
);

script.src =
GAS_URL +
'?' +
qs;


script.onerror =
function() {

delete window[callbackName];

alert(
'無法連線到積點系統。'
);

};


document
.body
.appendChild(script);

}


/*************************************************
 * 顯示學生
 *************************************************/

function showStudent(student) {

document
.getElementById('scannerPage')
.classList
.add('hidden');


document
.getElementById('startPage')
.classList
.add('hidden');


document
.getElementById('studentPage')
.classList
.remove('hidden');


document
.getElementById('studentClass')
.innerText =
(student.className || '') +
'　' +
(student.seatNo || '') +
'號';


document
.getElementById('studentName')
.innerText =
student.name || '';


document
.getElementById('studentPoints')
.innerText =
(student.points || 0) +
' 點';


document
.getElementById('studentLevel')
.innerText =
student.level || '';

}


/*************************************************
 * 停止相機
 *************************************************/

function stopCamera() {

scanning = false;


if (scanTimer) {

clearTimeout(
scanTimer
);

scanTimer = null;

}


if (stream) {

stream
.getTracks()
.forEach(
function(track) {

track.stop();

}
);

stream = null;

}


const video =
document.getElementById(
'cameraVideo'
);


if (video) {

video.srcObject =
null;

}

}


/*************************************************
 * 再掃描
 *************************************************/

function scanAgain() {

document
.getElementById('studentPage')
.classList
.add('hidden');

document
.getElementById('startPage')
.classList
.remove('hidden');

setStatus(
'請按「啟用相機」開始下一次掃描。'
);

}


/*************************************************
 * 返回 GAS
 *************************************************/

function goBackToGAS() {

window.location.href =
'https://script.google.com/a/macros/mail.rfes.tyc.edu.tw/s/AKfycbxVyxRnr4i071HzDjXZ43HL_LVbkqZgxWkTgdy8u8_lSwq5H2HsD_Qj-MSwW_spozcE/exec';

}


/*************************************************
 * 離開頁面
 *************************************************/

window.addEventListener(
'beforeunload',
function() {

stopCamera();

}
);

</script>

</body>

</html>
