<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             user-scalable=no,
             viewport-fit=cover">

  <meta
    name="theme-color"
    content="#1f4e78">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent">

  <title>瑞豐國小｜QR Code 掃描</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #101820;

      color: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      overscroll-behavior: none;

    }


    body {

      min-height:
        100dvh;

    }


    .app {

      min-height:
        100dvh;

      display:
        flex;

      flex-direction:
        column;

    }


    /* =========================
       Header
       ========================= */

    .header {

      padding:
        calc(
          env(safe-area-inset-top)
          + 14px
        )
        18px
        14px;

      background:
        linear-gradient(
          135deg,
          #1f4e78,
          #2e75b6
        );

      text-align:
        center;

      flex-shrink:
        0;

    }


    .header-title {

      font-size:
        21px;

      font-weight:
        800;

      line-height:
        1.4;

    }


    .header-subtitle {

      margin-top:
        4px;

      font-size:
        12px;

      opacity:
        .9;

    }


    /* =========================
       Main
       ========================= */

    .main {

      flex:
        1;

      display:
        flex;

      flex-direction:
        column;

      padding:
        14px;

      padding-bottom:
        calc(
          env(safe-area-inset-bottom)
          + 20px
        );

    }


    /* =========================
       Camera
       ========================= */

    .scanner-card {

      width:
        100%;

      max-width:
        600px;

      margin:
        0 auto;

      background:
        #18242d;

      border-radius:
        20px;

      overflow:
        hidden;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

    }


    .camera-container {

      position:
        relative;

      width:
        100%;

      aspect-ratio:
        1 / 1;

      background:
        #000;

      overflow:
        hidden;

    }


    #video {

      display:
        block;

      width:
        100%;

      height:
        100%;

      object-fit:
        cover;

      background:
        #000;

    }


    /* =========================
       掃描框
       ========================= */

    .scan-overlay {

      position:
        absolute;

      inset:
        0;

      pointer-events:
        none;

      display:
        flex;

      align-items:
        center;

      justify-content:
        center;

    }


    .scan-box {

      position:
        relative;

      width:
        64%;

      aspect-ratio:
        1 / 1;

      border:
        3px solid
        rgba(255,255,255,.9);

      border-radius:
        18px;

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.30);

    }


    .scan-box::before,
    .scan-box::after {

      content:
        "";

      position:
        absolute;

      width:
        28px;

      height:
        28px;

      border-color:
        #00e676;

      border-style:
        solid;

    }


    .scan-box::before {

      top:
        -3px;

      left:
        -3px;

      border-width:
        5px 0 0 5px;

      border-radius:
        12px 0 0 0;

    }


    .scan-box::after {

      right:
        -3px;

      bottom:
        -3px;

      border-width:
        0 5px 5px 0;

      border-radius:
        0 0 12px 0;

    }


    .scan-line {

      position:
        absolute;

      left:
        5%;

      right:
        5%;

      height:
        3px;

      background:
        #00e676;

      box-shadow:
        0 0 8px
        rgba(0,230,118,.9);

      animation:
        scanLine
        2s
        linear
        infinite;

    }


    @keyframes scanLine {

      0% {
        top: 8%;
      }

      50% {
        top: 88%;
      }

      100% {
        top: 8%;
      }

    }


    /* =========================
       Camera Message
       ========================= */

    .camera-message {

      position:
        absolute;

      left:
        15px;

      right:
        15px;

      bottom:
        15px;

      padding:
        10px 12px;

      border-radius:
        10px;

      background:
        rgba(0,0,0,.65);

      font-size:
        13px;

      text-align:
        center;

      display:
        none;

    }


    .camera-message.show {

      display:
        block;

    }


    /* =========================
       Status
       ========================= */

    .status {

      padding:
        16px;

      text-align:
        center;

    }


    .status-icon {

      font-size:
        36px;

      margin-bottom:
        6px;

    }


    .status-title {

      font-size:
        18px;

      font-weight:
        800;

    }


    .status-text {

      margin-top:
        6px;

      font-size:
        13px;

      line-height:
        1.6;

      color:
        #cfd8dc;

    }


    /* =========================
       Buttons
       ========================= */

    .buttons {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        10px;

      padding:
        0 14px 14px;

    }


    button {

      min-height:
        50px;

      border:
        0;

      border-radius:
        13px;

      font-size:
        16px;

      font-weight:
        700;

      cursor:
        pointer;

      touch-action:
        manipulation;

    }


    .btn-primary {

      background:
        #2e75b6;

      color:
        white;

    }


    .btn-primary:active {

      transform:
        scale(.98);

    }


    .btn-secondary {

      background:
        #37474f;

      color:
        white;

    }


    .btn-danger {

      background:
        #c62828;

      color:
        white;

    }


    button:disabled {

      opacity:
        .45;

      cursor:
        not-allowed;

    }


    /* =========================
       Result
       ========================= */

    .result {

      display:
        none;

      max-width:
        600px;

      margin:
        14px auto 0;

      width:
        100%;

      background:
        white;

      color:
        #263238;

      border-radius:
        20px;

      padding:
        22px;

      text-align:
        center;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.25);

    }


    .result.show {

      display:
        block;

    }


    .result-icon {

      font-size:
        55px;

    }


    .result-name {

      margin-top:
        8px;

      font-size:
        28px;

      font-weight:
        800;

    }


    .result-info {

      margin-top:
        8px;

      color:
        #607d8b;

    }


    .result-points {

      margin:
        18px 0;

      font-size:
        40px;

      font-weight:
        900;

      color:
        #1f4e78;

    }


    /* =========================
       Error
       ========================= */

    .error-box {

      display:
        none;

      margin:
        14px auto 0;

      max-width:
        600px;

      width:
        100%;

      padding:
        16px;

      border-radius:
        15px;

      background:
        #3b2020;

      border:
        1px solid
        #ef5350;

      color:
        #ffcdd2;

      line-height:
        1.6;

      font-size:
        14px;

    }


    .error-box.show {

      display:
        block;

    }


    .permission-help {

      margin-top:
        10px;

      padding:
        12px;

      border-radius:
        10px;

      background:
        rgba(255,255,255,.08);

    }


    .permission-help strong {

      display:
        block;

      margin-bottom:
        6px;

      color:
        #ffffff;

    }


    /* =========================
       Loading
       ========================= */

    .loading {

      display:
        none;

      position:
        fixed;

      inset:
        0;

      z-index:
        9999;

      background:
        rgba(0,0,0,.65);

      align-items:
        center;

      justify-content:
        center;

    }


    .loading.show {

      display:
        flex;

    }


    .loading-box {

      background:
        white;

      color:
        #263238;

      padding:
        24px;

      border-radius:
        18px;

      text-align:
        center;

      min-width:
        200px;

    }


    .spinner {

      width:
        42px;

      height:
        42px;

      margin:
        0 auto 14px;

      border:
        4px solid
        #e0e0e0;

      border-top-color:
        #1f4e78;

      border-radius:
        50%;

      animation:
        spin
        1s
        linear
        infinite;

    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    /* =========================
       Desktop
       ========================= */

    @media (min-width: 700px) {

      .camera-container {

        aspect-ratio:
          4 / 3;

      }

      .scan-box {

        width:
          45%;

      }

    }

  </style>

</head>


<body>


<div class="app">


  <!-- =========================
       Header
       ========================= -->

  <header class="header">

    <div class="header-title">

      📷 瑞豐國小 QR Code 掃描

    </div>

    <div class="header-subtitle">

      數位積點系統 V1.3

    </div>

  </header>


  <!-- =========================
       Main
       ========================= -->

  <main class="main">


    <section class="scanner-card">


      <!-- Camera -->

      <div class="camera-container">

        <video
          id="video"
          autoplay
          muted
          playsinline
          webkit-playsinline>
        </video>


        <div class="scan-overlay">

          <div class="scan-box">

            <div class="scan-line"></div>

          id="cameraMessage"

        </div>

      </div>


      <!-- Status -->

      <div class="status">

        <div
          id="statusIcon"
          class="status-icon">

          📷

        </div>


        <div
          id="statusTitle"
          class="status-title">

          準備掃描

        </div>


        <div
          id="statusText"
          class="status-text">

          請將學生 QR Code
          放入掃描框內

        </div>

      </div>


      <!-- Buttons -->

      <div class="buttons">

        <button
          id="startButton"
          class="btn-primary"
          onclick="startCamera()">

          📷 啟用相機

          onclick="switchCamera()">

          🔄 切換鏡頭

        </button>

    <!-- Error -->

    <div
      id="errorBox"
      class="error-box">

    </div>


    <!-- Result -->

    <div
      id="result"
      class="result">

      <div class="result-icon">

        ✅

      </div>


      <div
        id="resultTitle"
        class="result-name">

        掃描成功

      </div>


      <div
        id="resultInfo"
        class="result-info">

      </div>


      <div
        id="resultQR"
        style="
          margin-top:10px;
          font-size:12px;
          color:#90a4ae;
          word-break:break-all;
        ">

      </div>


      <button
        class="btn-primary"
        style="margin-top:18px;"
        onclick="scanAgain()">

        📷 掃描下一位學生

      </button>


    </div>


  </main>


</div>


<!-- Loading -->

<div
  id="loading"
  class="loading">

  <div class="loading-box">

    <div class="spinner"></div>

    <strong>
      處理中……
    </strong>

  </div>

</div>


<!-- =========================
     QR Code Library
     ========================= -->

<script
  src="https://unpkg.com/html5-qrcode"
  crossorigin="anonymous">
</script>


<script>


/*************************************************
 * V1.3
 * GitHub Pages QR Scanner
 *************************************************/


/*************************************************
 * 全域變數
 *************************************************/

let html5QrCode = null;

let cameraRunning = false;

let scanningLocked = false;

let currentCameraId = null;

let cameras = [];

let cameraIndex = 0;

let teacherId = '';


/*************************************************
 * GAS Web App URL
 *
 * 這裡填入你的 GAS Web App exec 網址
 *************************************************/

const GAS_URL =
  'https://script.google.com/a/macros/mail.rfes.tyc.edu.tw/s/AKfycbyIDACQajwC1nFgtarT8anucbsgixLrT0NGRWZBd7MVQjwWwF01F5Fc9EAoliT9KAY_/exec';


/*************************************************
 * 取得網址參數
 *************************************************/

function getTeacherId() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  return (
    params.get('teacher') ||
    ''
  ).trim();

}


/*************************************************
 * 頁面初始化
 *************************************************/

document.addEventListener(
  'DOMContentLoaded',
  function() {

    teacherId =
      getTeacherId();


    if (!teacherId) {

      setStatus(
        '⚠️',
        '缺少教師資料',
        '請從教師積點系統進入掃描頁面。'
      );

      showError(
        '找不到教師 ID。<br><br>' +
        '請不要直接開啟 GitHub Pages，' +
        '請從「教師積點系統」點選「掃描學生 QR Code」。'
      );

      return;

    }


    if (
      location.protocol !==
      'https:'
      &&
      location.hostname !==
      'localhost'
    ) {

      setStatus(
        '🔒',
        '需要 HTTPS',
        'iPhone Chrome 必須在 HTTPS 網址使用相機。'
      );

      showError(
        '目前網頁不是 HTTPS。<br><br>' +
        '請使用 GitHub Pages 的網址開啟，' +
        '例如：<br>' +
        'https://tg040383-cpu.github.io/rf-school-qr-scanner/'
      );

      return;

    }


    initScanner();

  }
);


/*************************************************
 * 初始化 Scanner
 *************************************************/

async function initScanner() {

  setStatus(
    '📷',
    '準備相機',
    '請點擊「啟用相機」。'
  );


  if (
    typeof Html5Qrcode ===
    'undefined'
  ) {

    showError(
      'QR Code 掃描元件載入失敗。<br>' +
      '請確認網路連線後重新整理頁面。'
    );

    return;

  }


  html5QrCode =
    new Html5Qrcode(
      'video'
    );

}


/*************************************************
 * 啟用相機
 *************************************************/

async function startCamera() {

  clearError();

  hideResult();

  scanningLocked =
    false;


  if (
    !window.isSecureContext
    &&
    location.hostname !==
    'localhost'
  ) {

    showError(
      'iPhone Chrome 必須在 HTTPS 網頁才能使用相機。'
    );

    return;

  }


  setStatus(
    '📷',
    '正在啟用相機',
    '第一次使用時，Chrome 會詢問相機權限。'
  );


  document
    .getElementById(
      'startButton'
    )
    .disabled = true;


  try {

    /*
     * 先直接請求相機權限。
     *
     * 這對 iPhone Chrome 非常重要。
     */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: 'environment'
            }

          },

          audio: false

        });


    /*
     * 取得權限後立即關閉測試串流。
     * html5-qrcode 接著自己開啟相機。
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    await loadCameras();


    if (!cameras.length) {

      throw new Error(
        '找不到可用相機'
      );

    }


    /*
     * 優先使用後鏡頭
     */

    let selected =
      cameras.find(
        function(camera) {

          return /back|rear|environment/i
            .test(
              camera.label
            );

        }
      );


    if (!selected) {

      selected =
        cameras[
          cameras.length > 1
            ? 1
            : 0
        ];

    }


    currentCameraId =
      selected.id;


    cameraIndex =
      cameras.findIndex(
        function(camera) {

          return camera.id ===
            currentCameraId;

        }
      );


    await startScanner(
      currentCameraId
    );


  } catch (error) {

    console.error(
      'Camera error:',
      error
    );


    handleCameraError(
      error
    );

  } finally {

    document
      .getElementById(
        'startButton'
      )
      .disabled = false;

  }

}


/*************************************************
 * 取得相機清單
 *************************************************/

async function loadCameras() {

  try {

    cameras =
      await Html5Qrcode
        .getCameras();


    if (!cameras) {

      cameras = [];

    }

  } catch (error) {

    console.error(
      'getCameras error:',
      error
    );

    cameras = [];

  }

}


/*************************************************
 * 啟動 QR Scanner
 *************************************************/

async function startScanner(
  cameraId
) {

  if (!html5QrCode) {

    html5QrCode =
      new Html5Qrcode(
        'video'
      );

  }


  if (cameraRunning) {

    await stopCamera();

  }


  setStatus(
    '📷',
    '掃描中',
    '請將學生 QR Code 放入框內。'
  );


  showCameraMessage(
    '掃描器啟動中……'
  );


  const config = {

    fps: 10,

    qrbox: function(
      viewfinderWidth,
      viewfinderHeight
    ) {

      const minSize =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        );


      return {

        width:
          Math.floor(
            minSize * .64
          ),

        height:
          Math.floor(
            minSize * .64
          )

      };

    },

    aspectRatio:
      1.0,

    disableFlip:
      false

  };


  try {

    await html5QrCode.start(

      cameraId,

      config,

      onScanSuccess,

      onScanFailure

    );


    cameraRunning =
      true;


    hideCameraMessage();


    document
      .getElementById(
        'switchButton'
      )
      .disabled =
      cameras.length <= 1;


  } catch (error) {

    console.error(
      'Scanner start error:',
      error
    );


    handleCameraError(
      error
    );

  }

}


/*************************************************
 * QR Code 掃描成功
 *************************************************/

async function onScanSuccess(
  decodedText
) {

  if (scanningLocked) {

    return;

  }


  scanningLocked =
    true;


  console.log(
    'QR Code:',
    decodedText
  );


  setStatus(
    '✅',
    '掃描成功',
    '正在查詢學生資料……'
  );


  await stopCamera();


  const qrId =
    extractQrId(
      decodedText
    );


  showLoading(
    true
  );


  try {

    const result =
      await getStudentFromGAS(
        qrId
      );


    showLoading(
      false
    );


    if (!result.success) {

      showError(
        result.message ||
        '找不到學生資料。'
      );


      setStatus(
        '❌',
        '查無學生',
        '請確認學生 QR Code 是否正確。'
      );


      scanningLocked =
        false;


      return;

    }


    showStudentResult(
      result.student,
      qrId
    );


  } catch (error) {

    showLoading(
      false
    );


    console.error(
      error
    );


    showError(
      '無法連線至瑞豐國小積點系統。<br><br>' +
      escapeHtml(
        error.message ||
        String(error)
      )
    );


    setStatus(
      '❌',
      '查詢失敗',
      '請確認網路連線後重新掃描。'
    );


    scanningLocked =
      false;

  }

}


/*************************************************
 * QR Code 掃描失敗
 *************************************************/

function onScanFailure(
  errorMessage
) {

  /*
   * 這裡不要顯示錯誤。
   *
   * QR Scanner 每一幀掃不到 QR Code
   * 都會呼叫這個函式。
   */

}


/*************************************************
 * 處理 QR Code 內容
 *************************************************/

function extractQrId(
  text
) {

  text =
    String(
      text || ''
    ).trim();


  /*
   * 情況一：
   * QR Code 直接放：
   * S001
   */

  if (
    text.indexOf('?') === -1 &&
    text.indexOf('=') === -1
  ) {

    return text;

  }


  /*
   * 情況二：
   * QR Code：
   * https://xxx/?student=S001
   */

  try {

    const url =
      new URL(
        text
      );


    const possibleKeys = [

      'student',

      'studentId',

      'student_id',

      'qr',

      'qrId',

      'qr_id'

    ];


    for (
      const key of possibleKeys
    ) {

      const value =
        url.searchParams.get(
          key
        );


      if (value) {

        return value.trim();

      }

    }

  } catch (e) {

    console.log(
      'QR URL parse failed'
    );

  }


  return text;

}


/*************************************************
 * 從 GAS 取得學生
 *
 * 使用 JSONP 避免 GitHub Pages
 * 跨來源 fetch 的 CORS 問題。
 *************************************************/

function getStudentFromGAS(
  qrId
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        'gasCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      let script = null;

      let timer = null;


      window[
        callbackName
      ] =
        function(result) {

          cleanup();

          resolve(
            result
          );

        };


      function cleanup() {

        if (timer) {

          clearTimeout(
            timer
          );

        }


        if (script) {

          script.remove();

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] = undefined;

        }

      }


      const url =
        GAS_URL +
        '?action=scan' +
        '&qrId=' +
        encodeURIComponent(
          qrId
        ) +
        '&teacher=' +
        encodeURIComponent(
          teacherId
        ) +
        '&callback=' +
        encodeURIComponent(
          callbackName
        );


      script =
        document.createElement(
          'script'
        );


      script.src =
        url;


      script.async =
        true;


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'GAS Web App 無法連線'
            )
          );

        };


      document
        .body
        .appendChild(
          script
        );


      timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                '連線逾時，請重新掃描。'
              )
            );

          },
          15000
        );

    }
  );

}


/*************************************************
 * 顯示學生
 *************************************************/

function showStudentResult(
  student,
  qrId
) {

  hideError();


  document
    .getElementById(
      'resultTitle'
    )
    .innerText =
    student.name ||
    '學生';


  document
    .getElementById(
      'resultInfo'
    )

/*************************************************
 * 再掃一次
 *************************************************/

async function scanAgain() {

  hideResult();

  clearError();

  scanningLocked =
    false;


  setStatus(
    '📷',
    '準備掃描',
    '請將下一位學生的 QR Code 放入框內。'
  );


  try {

    if (!cameraRunning) {

      await startCamera();

    }

  } catch (error) {

    handleCameraError(
      error
    );

  }

}


/*************************************************
 * 切換前後鏡頭
 *************************************************/

async function switchCamera() {

  if (
    cameras.length <= 1
  ) {

    alert(
      '目前找不到第二個可用鏡頭。'
    );

    return;

  }


  try {

    scanningLocked =
      false;


    cameraIndex =
      (
        cameraIndex + 1
      ) %
      cameras.length;


    currentCameraId =
      cameras[
        cameraIndex
      ].id;


    await startScanner(
      currentCameraId
    );


  } catch (error) {

    handleCameraError(
      error
    );

  }

}


/*************************************************
 * 停止相機
 *************************************************/

async function stopCamera() {

  if (
    !html5QrCode
  ) {

    return;

  }


  try {

    if (cameraRunning) {

      await html5QrCode.stop();

    }

  } catch (error) {

    console.warn(
      'stop camera:',
      error
    );

  }


  cameraRunning =
    false;

}


/*************************************************
 * 相機錯誤
 *************************************************/

function handleCameraError(
  error
) {

  console.error(
    error
  );


  let message =
    '相機無法啟用。';


  const errorName =
    error &&
    error.name
      ? error.name
      : '';


  if (
    errorName ===
    'NotAllowedError'
  ) {

    message =
      '<strong>📵 相機權限被拒絕</strong><br><br>' +
      '請在 iPhone Chrome 開啟：<br>' +
      '<strong>設定 → Chrome → 相機 → 開啟</strong><br><br>' +
      '如果 Chrome 網站本身被封鎖，請在 Chrome 網址列左側的網站設定中重新允許相機。';

  }


  else if (
    errorName ===
    'NotFoundError'
  ) {

    message =
      '<strong>📷 找不到相機</strong><br><br>' +
      '請確認 iPhone 相機可以正常使用。';

  }


  else if (
    errorName ===
    'NotReadableError'
  ) {

    message =
      '<strong>📷 相機目前被其他程式使用</strong><br><br>' +
      '請關閉其他正在使用相機的 App，' +
      '再重新開啟本頁面。';

  }


  else if (
    errorName ===
    'SecurityError'
  ) {

    message =
      '<strong>🔒 瀏覽器安全性限制</strong><br><br>' +
      '請確認你是使用 GitHub Pages 的 HTTPS 網址。';

  }


  else {

    message +=
      '<br><br>' +
      escapeHtml(
        error &&
        error.message
          ? error.message
          : String(error)
      );

  }


  showError(
    message
  );


  setStatus(
    '❌',
    '相機無法使用',
    '請依照下方提示處理後，再按「啟用相機」。'
  );


  document
    .getElementById(
      'startButton'
    )
    .disabled = false;

}


/*************************************************
 * 顯示錯誤
 *************************************************/

function showError(
  message
) {

  const box =
    document.getElementById(
      'errorBox'
    );


  box.innerHTML =
    message +
    `

      <div class="permission-help">

        <strong>
          🍎 iPhone Chrome 建議檢查
        </strong>

        1. 確認使用
        <strong>
          https://tg040383-cpu.github.io/
        </strong>

        開頭的 HTTPS 網址。<br>

        2. iPhone：
        <strong>
          設定 → Chrome → 相機 → 開啟
        </strong><br>

        3. 回到 Chrome 後重新整理本頁。<br>

        4. 如果曾經選擇「不允許」，請重新開啟網站的相機權限。

      </div>

    `;


  box.classList.add(
    'show'
  );

}


/*************************************************
 * 隱藏錯誤
 *************************************************/

function hideError() {

  document
    .getElementById(
      'errorBox'
    )
    .classList
    .remove('show');

}


/*************************************************
 * 清除錯誤
 *************************************************/

function clearError() {

  hideError();

}

      'statusIcon'

  document

    )

    .getElementById(

 *************************************************/

    );

 * 隱藏結果
 *************************************************/

function hideResult() {

  document
    .getElementById(
      'result'
    )
    .classList
    .remove('show');

}


/*************************************************
 * HTML Escape
 *************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


/*************************************************
 * 離開頁面前停止相機

  'pagehide',

    stopCamera();

  }
);

  }
);
