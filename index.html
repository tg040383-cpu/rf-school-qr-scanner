<script>


/* =====================================================
   GAS Web App URL
====================================================== */


const GAS_URL =
  'https://script.google.com/a/macros/mail.rfes.tyc.edu.tw/s/AKfycbyIDACQajwC1nFgtarT8anucbsgixLrT0NGRWZBd7MVQjwWwF01F5Fc9EAoliT9KAY_/exec';


/* =====================================================
   系統變數
====================================================== */


let teacher = null;

let student = null;

let rewardItems = [];

let selectedCategory = '';

let selectedReward = null;

let html5QrCode = null;

let scannerRunning = false;

let jsonpCounter = 0;


/* =====================================================
   JSONP
====================================================== */


function jsonp(
  action,
  params = {},
  timeout = 15000
) {

  return new Promise(
    function(resolve, reject) {


      const callbackName =
        'rfesJsonp_' +
        Date.now() +
        '_' +
        (++jsonpCounter);


      const script =
        document.createElement(
          'script'
        );


      let timer;


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);

        };


      function cleanup() {

        if (timer) {

          clearTimeout(timer);

        }


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {

          window[
            callbackName
          ] = undefined;

        }

      }


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              '無法連線到 Google Apps Script'
            )
          );

        };


      timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                '連線逾時，請確認網路連線'
              )
            );

          },
          timeout
        );


      const query =
        new URLSearchParams();


      query.set(
        'action',
        action
      );


      query.set(
        'callback',
        callbackName
      );


      Object.keys(params)
        .forEach(
          function(key) {

            const value =
              params[key];


            if (
              value !== undefined &&
              value !== null
            ) {

              query.set(
                key,
                String(value)
              );

            }

          }
        );


      script.src =
        GAS_URL +
        '?' +
        query.toString();


      document
        .head
        .appendChild(
          script
        );

    }
  );

}


/* =====================================================
   頁面控制
====================================================== */


function hidePages() {

  const pages = [

    'loginPage',

    'homePage',

    'scannerPage',

    'studentPage',

    'categoryPage',

    'rewardPage',

    'confirmPage',

    'successPage',

    'recordsPage'

  ];


  pages.forEach(
    function(id) {

      const element =
        document.getElementById(
          id
        );


      if (element) {

        element.classList.add(
          'hidden'
        );

      }

    }
  );

}


/* =====================================================
   首頁
====================================================== */


function showHome() {

  stopScanner();

  hidePages();


  document
    .getElementById(
      'homePage'
    )
    .classList
    .remove(
      'hidden'
    );


  loadTodayPoints();

}


/* =====================================================
   登入
====================================================== */


async function login() {

  const email =
    document
      .getElementById(
        'email'
      )
      .value
      .trim()
      .toLowerCase();


  if (!email) {

    alert(
      '請輸入教師 Email'
    );

    return;

  }


  const button =
    document
      .getElementById(
        'loginButton'
      );


  const status =
    document
      .getElementById(
        'loginStatus'
      );


  button.disabled =
    true;


  button.innerText =
    '登入中……';


  status.classList
    .remove(
      'hidden'
    );


  status.innerText =
    '正在連線到學校系統……';


  try {

    const result =
      await jsonp(
        'teacherLogin',
        {
          email:
            email
        }
      );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        result &&
        result.message
          ? result.message
          : '登入失敗'
      );

    }


    teacher =
      result.teacher;


    document
      .getElementById(
        'teacherName'
      )
      .innerText =
      '👨‍🏫 ' +
      teacher.name;


    status.classList.add(
      'hidden'
    );


    await loadRewards();


    showHome();


  } catch (error) {

    alert(
      '登入失敗：\n' +
      error.message
    );


    status.innerText =
      error.message;

  } finally {

    button.disabled =
      false;


    button.innerText =
      '登入系統';

  }

}


/* =====================================================
   載入獎勵
====================================================== */


async function loadRewards() {

  try {

    const result =
      await jsonp(
        'getRewards'
      );


    if (
      result &&
      result.success
    ) {

      rewardItems =
        result.rewards || [];

    } else {

      rewardItems = [];

    }

  } catch (error) {

    console.error(
      '載入獎勵失敗',
      error
    );

    rewardItems = [];

  }

}


/* =====================================================
   Scanner
====================================================== */


async function openScanner() {

  if (!teacher) {

    alert(
      '請先登入教師帳號'
    );

    return;

  }


  hidePages();


  document
    .getElementById(
      'scannerPage'
    )
    .classList
    .remove(
      'hidden'
    );


  const status =
    document
      .getElementById(
        'cameraStatus'
      );


  status.innerText =
    '正在啟動相機……';


  /*
   * 先停止舊 Scanner
   */

  await stopScanner();


  /*
   * iPhone Chrome / Safari
   *
   * getUserMedia 必須在 HTTPS
   */

  if (
    !window.isSecureContext
  ) {

    status.innerText =
      '⚠️ 目前不是 HTTPS 網頁，iPhone 無法啟用相機。';


    alert(
      '相機需要 HTTPS。\n\n請使用 GitHub Pages 的 https:// 網址開啟。'
    );


    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    status.innerText =
      '⚠️ 此瀏覽器不支援相機功能。';


    alert(
      '目前瀏覽器不支援相機功能。'
    );


    return;

  }


  try {

    /*
     * 先要求相機權限
     */

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal:
                'environment'
            }

          },

          audio: false

        });


    /*
     * 立即停止測試串流
     *
     * 接下來交給 html5-qrcode
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


  } catch (error) {

    console.error(
      'Camera permission error:',
      error
    );


    status.innerText =
      getCameraErrorMessage(
        error
      );


    alert(
      getCameraErrorMessage(
        error
      )
    );


    return;

  }


  /*
   * 啟動 QR Scanner
   */

  startHtml5Scanner();

}


/* =====================================================
   啟動 html5-qrcode
====================================================== */


function startHtml5Scanner() {

  const status =
    document
      .getElementById(
        'cameraStatus'
      );


  status.innerText =
    '📷 相機已啟動，請將 QR Code 放入框內';


  try {

    html5QrCode =
      new Html5Qrcode(
        'reader'
      );


    html5QrCode
      .start(

        {
          facingMode:
            'environment'
        },

        {

          fps: 10,

          qrbox: function(
            viewfinderWidth,
            viewfinderHeight
          ) {

            const minEdge =
              Math.min(
                viewfinderWidth,
                viewfinderHeight
              );


            const size =
              Math.floor(
                minEdge * 0.68
              );


            return {

              width:
                Math.max(
                  220,
                  Math.min(
                    320,
                    size
                  )
                ),

              height:
                Math.max(
                  220,
                  Math.min(
                    320,
                    size
                  )
                )

            };

          },

          aspectRatio: 1.0,

          disableFlip: false

        },

        onScanSuccess,

        onScanFailure

      )

      .then(
        function() {

          scannerRunning =
            true;

          status.innerText =
            '📷 掃描中……';

        }
      )

      .catch(
        function(error) {

          scannerRunning =
            false;


          console.error(
            'Scanner start error:',
            error
          );


          status.innerText =
            '相機啟動失敗';


          alert(
            getCameraErrorMessage(
              error
            )
          );

        }
      );


  } catch (error) {

    console.error(
      error
    );


    status.innerText =
      '無法建立掃描器';


    alert(
      '無法建立 QR Code 掃描器：\n' +
      error.message
    );

  }

}


/* =====================================================
   QR Code 掃描成功
====================================================== */


let scanProcessing =
  false;


async function onScanSuccess(
  decodedText
) {

  if (
    scanProcessing
  ) {

    return;

  }


  scanProcessing =
    true;


  const status =
    document
      .getElementById(
        'cameraStatus'
      );


  status.innerText =
    '🔎 已掃描，正在查詢學生資料……';


  await stopScanner();


  try {

    const result =
      await jsonp(
        'getStudentByQR',
        {

          qr:
            decodedText

        }
      );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        result &&
        result.message
          ? result.message
          : '找不到學生資料'
      );

    }


    showStudentData(
      result.student
    );


  } catch (error) {

    alert(
      '查詢學生失敗：\n' +
      error.message
    );


    showHome();

  } finally {

    scanProcessing =
      false;

  }

}

/* =====================================================
   停止 Scanner
====================================================== */


async function stopScanner() {

  scannerRunning =
    false;


  if (
    html5QrCode
  ) {

    try {

      if (
        html5QrCode.isScanning
      ) {

        await html5QrCode.stop();

      }

    } catch (error) {

      console.warn(
        'stop scanner:',
        error
      );

    }


    try {

      await html5QrCode.clear();

    } catch (error) {

      console.warn(
        'clear scanner:',
        error
      );

    }


    html5QrCode =
      null;

  }

}


/* =====================================================
   相機錯誤訊息
====================================================== */


function getCameraErrorMessage(
  error
) {

  const name =
    error &&
    error.name
      ? error.name
      : '';


  switch (name) {


    case 'NotAllowedError':

      return (
        '📷 相機權限被拒絕。\n\n' +

        '請到 iPhone：\n' +

        '設定 → Apps → Chrome → 相機 → 開啟\n\n' +

        '然後重新整理本頁。'
      );


    case 'PermissionDeniedError':

      return (
        '📷 相機權限被拒絕。\n\n' +

        '請到 iPhone 設定中允許 Chrome 使用相機。'
      );


    case 'NotFoundError':

      return (
        '📷 找不到相機。\n\n' +

        '請確認 iPhone 相機功能正常。'
      );


    case 'NotReadableError':

      return (
        '📷 相機目前被其他程式使用。\n\n' +

        '請關閉其他使用相機的 App，再重新嘗試。'
      );


    case 'OverconstrainedError':

      return (
        '📷 相機設定不相容。\n\n' +

        '請重新整理頁面後再試一次。'
      );


    case 'SecurityError':

      return (
        '📷 瀏覽器安全性限制。\n\n' +

        '請確認目前使用的是 HTTPS 網址。'
      );


    default:

      return (
        '📷 無法啟用相機。\n\n' +

        '請確認：\n' +

        '1. 使用 HTTPS 網址\n' +

        '2. Chrome 已允許使用相機\n' +

        '3. 重新整理網頁後再試'
      );

  }

}

/* =====================================================
   送出加點
====================================================== */


async function submitPoint() {

  if (
    !teacher ||
    !student ||
    !selectedReward
  ) {

    alert(
      '資料不完整'
    );

    return;

  }


  const button =
    document
      .getElementById(
        'submitButton'
      );


  button.disabled =
    true;


  button.innerText =
    '送出中……';


  const remark =
    document
      .getElementById(
        'remark'
      )
      .value
      .trim();


  try {

    const result =
      await jsonp(
        'addPoint',
        {

          teacherId:
            teacher.id,

          studentId:
            student.id,

          rewardId:
            selectedReward.id,

          remark:
            remark

        },
        20000
      );


    if (
      !result ||
      !result.success
    ) {

      throw new Error(
        result &&
        result.message
          ? result.message
          : '加點失敗'
      );

    }


    /*
     * 更新目前學生資料
     */

    student.points =
      result.totalPoints;


    student.level =
      result.level;


    /*
     * 顯示成功
     */

    document
      .getElementById(
        'successStudent'
      )
      .innerText =
      result.student.name;


    document
      .getElementById(
        'successAdd'
      )
      .innerText =
      '+' +
      result.reward.points +
      ' 點';


    document
      .getElementById(
        'successTotal'
      )
      .innerText =
      result.totalPoints +
      ' 點';


    document
      .getElementById(
        'successLevel'
      )
      .innerText =
      result.level;


    hidePages();


    document
      .getElementById(
        'successPage'
      )
      .classList
      .remove(
        'hidden'
      );


  } catch (error) {

    alert(
      '加點失敗：\n' +
      error.message
    );

  } finally {

    button.disabled =
      false;


    button.innerText =
      '✓ 確認送出';

  }

}

    );

/* =====================================================
   HTML 安全
====================================================== */


function escapeHtml(
  value
) {

  return String(
    value == null
      ? ''
      : value
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}
