<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta
  name="theme-color"
  content="#1f4e78">

<title>
  瑞豐國小｜QR Code 掃描
</title>


<style>

* {

  box-sizing:
    border-box;

  -webkit-tap-highlight-color:
    transparent;

}


html,
body {

  margin: 0;

  padding: 0;

  width: 100%;

  min-height: 100%;

  background: #f4f7fb;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

}


body {

  color: #263238;

}


.header {

  background:
    linear-gradient(
      135deg,
      #1f4e78,
      #2e75b6
    );

  color: white;

  text-align: center;

  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    18px;

}


.header h1 {

  margin: 0;

  font-size: 23px;

}


.header p {

  margin:
    6px 0 0;

  font-size: 13px;

}


.container {

  width: 100%;

  max-width: 520px;

  margin: auto;

  padding: 16px;

}


.card {

  background: white;

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 16px;

  box-shadow:
    0 4px 18px
    rgba(0,0,0,.08);

}


.center {

  text-align: center;

}


.camera-box {

  position: relative;

  width: 100%;

  aspect-ratio: 1 / 1;

  background: #111;

  border-radius: 18px;

  overflow: hidden;

  margin:
    15px 0;

}


video {

  display: block;

  width: 100%;

  height: 100%;

  object-fit: cover;

}


.scan-frame {

  position: absolute;

  width: 65%;

  height: 65%;

  left: 17.5%;

  top: 17.5%;

  border:
    3px solid white;

  border-radius: 18px;

  box-shadow:
    0 0 0 9999px
    rgba(0,0,0,.25);

  pointer-events: none;

}


.scan-line {

  position: absolute;

  left: 18%;

  width: 64%;

  height: 3px;

  top: 20%;

  background: #00e676;

  animation:
    scanMove 2s infinite ease-in-out;

  display: none;

}


@keyframes scanMove {

  0% {
    top: 20%;
  }

  50% {
    top: 78%;
  }

  100% {
    top: 20%;
  }

}


button {

  width: 100%;

  min-height: 54px;

  border: 0;

  border-radius: 15px;

  font-size: 17px;

  font-weight: 700;

  margin-bottom: 12px;

  touch-action: manipulation;

}


button:active {

  transform:
    scale(.98);

}


.primary {

  background: #1f4e78;

  color: white;

}


.success {

  background: #43a047;

  color: white;

}


.secondary {

  background: #eceff1;

  color: #37474f;

}


.danger {

  background: #ffebee;

  color: #c62828;

}


.status {

  padding: 13px;

  border-radius: 12px;

  background: #eceff1;

  text-align: center;

  font-size: 14px;

  line-height: 1.6;

}


.status.ok {

  background: #e8f5e9;

  color: #2e7d32;

}


.status.error {

  background: #ffebee;

  color: #c62828;

}


.status.warning {

  background: #fff8e1;

  color: #f57f17;

}


.result {

  text-align: center;

}


.student-name {

  font-size: 30px;

  font-weight: 800;

  margin: 10px 0;

}


.student-class {

  font-size: 18px;

  color: #546e7a;

}


.points {

  font-size: 38px;

  font-weight: 800;

  color: #1f4e78;

  margin: 12px 0;

}


.hidden {

  display: none !important;

}


.small {

  color: #78909c;

  font-size: 13px;

  line-height: 1.6;

}


.loader {

  display: inline-block;

  width: 18px;

  height: 18px;

  border:
    3px solid #ddd;

  border-top-color:
    #1f4e78;

  border-radius: 50%;

  animation:
    spin .8s linear infinite;

  vertical-align: middle;

}


@keyframes spin {

  to {
    transform: rotate(360deg);
  }

}

</style>

</head>


<body>


<div class="header">

  <h1>
    📷 瑞豐國小 QR 掃描
  </h1>

  <p>
    數位積點系統 V1.3
  </p>

</div>


<div class="container">


<!-- 啟動畫面 -->

<div
  id="startPage"
  class="card center">

  <div
    style="
      font-size:70px;
      margin-bottom:10px;
    ">

    📷

  </div>


  <h2>
    學生 QR Code 掃描
  </h2>


  <p class="small">

    使用 iPhone Chrome 時，<br>
    請點擊下方按鈕啟用相機。

  </p>


  <button
    id="startButton"
    class="primary">

    📷 啟用相機

  </button>


  <button
    id="backButton"
    class="secondary">

    ← 返回教師系統

  </button>


  <div
    id="status"
    class="status">

    尚未啟用相機

  </div>

</div>


<!-- 掃描 -->

<div
  id="scannerPage"
  class="hidden">

  <div class="card">

    <div
      id="cameraStatus"
      class="status">

      正在啟動相機…

    </div>


    <div class="camera-box">

      <video
        id="video"
        autoplay
        playsinline
        muted>
      </video>


      <div
        class="scan-frame">
      </div>


      <div
        id="scanLine"
        class="scan-line">
      </div>

    </div>


    <button
      id="switchButton"
      class="secondary">

      🔄 切換前／後鏡頭

    </button>


    <button
      id="stopButton"
      class="danger">

      ⏹ 停止相機

    </button>


    <p class="small center">

      請將學生 QR Code 放入白色框內。<br>
      系統辨識成功後會自動處理。

    </p>

  </div>

</div>


<!-- 成功 -->

<div
  id="resultPage"
  class="hidden">

  <div class="card result">

    <div
      style="
        font-size:60px;
      ">

      🎉

    </div>


    <h2>
      掃描成功
    </h2>


    <div
      id="studentClass"
      class="student-class">
    </div>


    <div
      id="studentName"
      class="student-name">
    </div>


    <div
      id="studentPoints"
      class="points">
    </div>


    <div
      id="studentLevel">
    </div>


    <br>


    <button
      id="continueButton"
      class="primary">

      ✓ 回到教師積點系統

    </button>


    <button
      id="scanAgainButton"
      class="secondary">

      📷 再掃描一位學生

    </button>

  </div>

</div>


</div>


<script>


/*************************************************
 * 設定
 *************************************************/


const CONFIG = {

  /*
   * Google Apps Script Web App
   */
  APPS_SCRIPT_URL:
    'https://script.google.com/a/macros/mail.rfes.tyc.edu.tw/s/AKfycbyIDACQajwC1nFgtarT8anucbsgixLrT0NGRWZBd7MVQjwWwF01F5Fc9EAoliT9KAY_/exec'

};


/*************************************************
 * 全域變數
 *************************************************/


let stream = null;

let scanning = false;

let currentFacingMode =
  'environment';

let detector = null;

let lastQr = '';

let lastScanTime = 0;

let teacherId = '';


/*************************************************
 * DOM
 *************************************************/


const startPage =
  document.getElementById(
    'startPage'
  );


const scannerPage =
  document.getElementById(
    'scannerPage'
  );


const resultPage =
  document.getElementById(
    'resultPage'
  );


const startButton =
  document.getElementById(
    'startButton'
  );


const backButton =
  document.getElementById(
    'backButton'
  );


const switchButton =
  document.getElementById(
    'switchButton'
  );


const stopButton =
  document.getElementById(
    'stopButton'
  );


const scanAgainButton =
  document.getElementById(
    'scanAgainButton'
  );


const continueButton =
  document.getElementById(
    'continueButton'
  );


const video =
  document.getElementById(
    'video'
  );


const statusBox =
  document.getElementById(
    'status'
  );


const cameraStatus =
  document.getElementById(
    'cameraStatus'
  );


const scanLine =
  document.getElementById(
    'scanLine'
  );


/*************************************************
 * 取得教師 ID
 *************************************************/


(function getTeacher() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  teacherId =
    params.get(
      'teacher'
    ) || '';


})();


/*************************************************
 * 狀態
 *************************************************/


function setStatus(
  message,
  type
) {

  statusBox.innerText =
    message;


  statusBox.className =
    'status';


  if (type) {

    statusBox.classList.add(
      type
    );

  }

}


function setCameraStatus(
  message,
  type
) {

  cameraStatus.innerText =
    message;


  cameraStatus.className =
    'status';


  if (type) {

    cameraStatus.classList.add(
      type
    );

  }

}


/*************************************************
 * 判斷瀏覽器
 *************************************************/


function isIOS() {

  return /iPhone|iPad|iPod/i
    .test(
      navigator.userAgent
    );

}


/*************************************************
 * 判斷 HTTPS
 *************************************************/


function isSecureContextOK() {

  return (
    window.isSecureContext === true ||
    location.hostname === 'localhost'
  );

}


/*************************************************
 * 開始相機
 *
 * 重點：
 * 必須由使用者 click 觸發。
 *************************************************/


async function startCamera() {

  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {

    setStatus(
      '此瀏覽器不支援網頁相機，請使用最新版 iPhone Chrome。',
      'error'
    );

    return;

  }


  if (!isSecureContextOK()) {

    setStatus(
      '目前不是 HTTPS 安全連線，無法啟用相機。',
      'error'
    );

    return;

  }


  stopCamera();


  setStatus(
    '正在要求相機權限…',
    'warning'
  );


  try {

    /*
     * iPhone Chrome 相容設定
     */

    stream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: false,

          video: {

            facingMode:
              {
                ideal:
                  currentFacingMode
              },

            width:
              {
                ideal: 1280
              },

            height:
              {
                ideal: 720
              }

          }

        });


    video.srcObject =
      stream;


    await video.play();


    startPage
      .classList
      .add(
        'hidden'
      );


    scannerPage
      .classList
      .remove(
        'hidden'
      );


    setCameraStatus(
      '相機已啟用，請掃描學生 QR Code',
      'ok'
    );


    scanLine.style.display =
      'block';


    prepareDetector();


    scanning =
      true;


    requestAnimationFrame(
      scanFrame
    );


  } catch (error) {

    console.error(
      error
    );


    handleCameraError(
      error
    );

  }

}


/*************************************************
 * 相機錯誤
 *************************************************/


function handleCameraError(
  error
) {

  stopCamera();


  let message =
    '無法啟用相機。';


  if (
    error &&
    error.name ===
      'NotAllowedError'
  ) {

    message =
      '相機權限被拒絕。\n\n' +
      '請到 iPhone：\n' +
      'Chrome → 網址列網站設定 → 相機 → 允許\n\n' +
      '設定後請重新整理本頁。';

  }


  else if (
    error &&
    error.name ===
      'NotFoundError'
  ) {

    message =
      '找不到相機。\n\n' +
      '請確認 iPhone 相機正常，並重新開啟 Chrome。';

  }


  else if (
    error &&
    error.name ===
      'NotReadableError'
  ) {

    message =
      '相機目前無法使用。\n\n' +
      '可能是其他 App 正在使用相機。\n' +
      '請關閉其他使用相機的 App 後再試。';

  }


  else if (
    error &&
    error.name ===
      'SecurityError'
  ) {

    message =
      '瀏覽器安全性設定阻止相機。\n\n' +
      '請確認目前網址是 HTTPS。';

  }


  else {

    message +=
      '\n\n錯誤：' +
      (
        error &&
        error.message
          ? error.message
          : '未知錯誤'
      );

  }


  setStatus(
    message,
    'error'
  );

}


/*************************************************
 * QR Code Detector
 *************************************************/


function prepareDetector() {

  /*
   * 優先使用原生 BarcodeDetector。
   * iPhone 新版瀏覽器若支援，
   * 不需要另外載入第三方 JS。
   */

  if (
    'BarcodeDetector'
    in window
  ) {

    try {

      detector =
        new BarcodeDetector({

          formats:
            [
              'qr_code'
            ]

        });

      return;

    } catch (error) {

      detector =
        null;

    }

  }

}


/*************************************************
 * 掃描
 *************************************************/


async function scanFrame() {

  if (!scanning) {

    return;

  }


  if (
    video.readyState <
    HTMLMediaElement.HAVE_ENOUGH_DATA
  ) {

    requestAnimationFrame(
      scanFrame
    );

    return;

  }


  if (!detector) {

    /*
     * 某些 iPhone Chrome 不支援
     * BarcodeDetector。
     *
     * 使用者仍然可以透過
     * 手動輸入 QR_ID。
     */

    setCameraStatus(
      '相機已啟用，但此瀏覽器不支援 QR 自動辨識。',
      'warning'
    );

    scanning =
      false;

    showManualInput();

    return;

  }


  try {

    const codes =
      await detector.detect(
        video
      );


    if (
      codes &&
      codes.length > 0
    ) {

      const raw =
        codes[0].rawValue;


      if (raw) {

        processQR(
          raw
        );

        return;

      }

    }

  } catch (error) {

    /*
     * 掃描過程錯誤不直接中斷。
     */

    console.log(
      'QR scan:',
      error
    );

  }


  requestAnimationFrame(
    scanFrame
  );

}


/*************************************************
 * QR Code 處理
 *************************************************/


function processQR(
  rawValue
) {

  const now =
    Date.now();


  /*
   * 避免同一 QR 在短時間內
   * 重複觸發。
   */

  if (
    rawValue === lastQr &&
    now - lastScanTime < 3000
  ) {

    return;

  }


  lastQr =
    rawValue;

  lastScanTime =
    now;


  scanning =
    false;


  stopCamera();


  setCameraStatus(
    '掃描成功，正在處理…',
    'ok'
  );


  /*
   * QR Code 可以直接是：
   *
   * ABC001
   *
   * 或：
   *
   * https://.../?qr=ABC001
   */

  const qrId =
    extractQrId(
      rawValue
    );


  if (!qrId) {

    alert(
      '無法辨識 QR Code 內容。\n\n' +
      rawValue
    );

    startPage
      .classList
      .remove(
        'hidden'
      );

    scannerPage
      .classList
      .add(
        'hidden'
      );

    return;

  }


  /*
   * 回傳 Apps Script。
   *
   * 最簡單、最穩定：
   * 直接導回 Apps Script Web App。
   */

  const url =
    CONFIG.APPS_SCRIPT_URL +
    '?qr=' +
    encodeURIComponent(
      qrId
    ) +
    (
      teacherId
        ? '&teacher=' +
          encodeURIComponent(
            teacherId
          )
        : ''
    );


  window.location.href =
    url;

}


/*************************************************
 * 解析 QR
 *************************************************/


function extractQrId(
  raw
) {

  raw =
    String(
      raw || ''
    ).trim();


  if (!raw) {

    return '';

  }


  /*
   * 如果 QR 本身是網址，
   * 嘗試抓取 qr 參數。
   */

  try {

    if (
      raw.indexOf('http://') === 0 ||
      raw.indexOf('https://') === 0
    ) {

      const url =
        new URL(
          raw
        );


      const qr =
        url.searchParams.get(
          'qr'
        );


      if (qr) {

        return qr.trim();

      }

    }

  } catch (error) {

    console.log(error);

  }


  /*
   * 一般 QR：
   * 直接使用內容。
   */

  return raw;

}


/*************************************************
 * 手動輸入
 *
 * 作為 iPhone 相容備援。
 *************************************************/


function showManualInput() {

  const result =
    prompt(
      '此瀏覽器不支援 QR 自動辨識。\n\n請輸入學生 QR_ID：'
    );


  if (!result) {

    return;

  }


  processQR(
    result.trim()
  );

}


/*************************************************
 * 停止相機
 *************************************************/


function stopCamera() {

  scanning =
    false;


  scanLine.style.display =
    'none';


  if (stream) {

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );

    stream =
      null;

  }


  video.srcObject =
    null;

}


/*************************************************
 * 切換鏡頭
 *************************************************/


async function switchCamera() {

  if (!stream) {

    await startCamera();

    return;

  }


  currentFacingMode =
    currentFacingMode ===
      'environment'
        ? 'user'
        : 'environment';


  await startCamera();

}


/*************************************************
 * 返回教師系統
 *************************************************/


function goBack() {

  stopCamera();


  window.location.href =
    CONFIG.APPS_SCRIPT_URL +
    (
      teacherId
        ? '?teacher=' +
          encodeURIComponent(
            teacherId
          )
        : ''
    );

}


/*************************************************
 * 再掃描
 *************************************************/


function scanAgain() {

  resultPage
    .classList
    .add(
      'hidden'
    );


  startPage
    .classList
    .remove(
      'hidden'
    );


  setStatus(
    '請點擊「啟用相機」',
    ''
  );

}


/*************************************************
 * 事件
 *************************************************/


startButton.addEventListener(
  'click',
  function() {

    /*
     * 非常重要：
     *
     * startCamera()
     * 必須直接由 click 事件觸發。
     *
     * 這是 iPhone Chrome 相機權限
     * 修正版的核心。
     */

    startCamera();

  }
);


switchButton.addEventListener(
  'click',
  function() {

    switchCamera();

  }
);


stopButton.addEventListener(
  'click',
  function() {

    stopCamera();


    scannerPage
      .classList
      .add(
        'hidden'
      );


    startPage
      .classList
      .remove(
        'hidden'
      );


    setStatus(
      '相機已停止，請重新啟用',
      ''
    );

  }
);


backButton.addEventListener(
  'click',
  function() {

    goBack();

  }
);


continueButton.addEventListener(
  'click',
  function() {

    goBack();

  }
);


scanAgainButton.addEventListener(
  'click',
  function() {

    scanAgain();

  }
);


/*************************************************
 * 頁面離開時關閉相機
 *************************************************/


window.addEventListener(
  'pagehide',
  function() {

    stopCamera();

  }
);


/*************************************************
 * 初始檢查
 *************************************************/


(function initialCheck() {

  if (!window.isSecureContext) {

    setStatus(
      '警告：目前不是安全 HTTPS 連線。',
      'error'
    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    setStatus(
      '目前瀏覽器不支援網頁相機。',
      'error'
    );

    return;

  }


  setStatus(
    '已準備完成，請點擊「啟用相機」。',
    'ok'
  );

})();

</script>

</body>

</html>
