<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>瑞豐國小｜QR Code 掃描</title>


  <!--
    html5-qrcode
    用於 iPhone Chrome 相機掃描
  -->

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    body {

      margin: 0;

      background: #f4f7fb;

      color: #263238;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

    }


    .header {

      background:
        linear-gradient(
          135deg,
          #1f4e78,
          #2e75b6
        );

      color: white;

      padding: 22px 16px;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 23px;

    }


    .header p {

      margin: 6px 0 0;

      font-size: 13px;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 16px;

    }


    .card {

      background: white;

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 16px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.07);

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 15px;

    }


    button {

      width: 100%;

      min-height: 52px;

      border: 0;

      border-radius: 14px;

      font-size: 17px;

      font-weight: 700;

      margin-top: 12px;

      font-family: inherit;

    }


    .primary {

      background: #1f4e78;

      color: white;

    }


    .secondary {

      background: #eceff1;

      color: #37474f;

    }


    .success {

      background: #43a047;

      color: white;

    }


    .center {

      text-align: center;

    }


    .icon {

      font-size: 58px;

      margin-bottom: 10px;

    }


    .status {

      padding: 13px;

      border-radius: 12px;

      background: #e3f2fd;

      color: #1565c0;

      margin-bottom: 15px;

      text-align: center;

      font-size: 14px;

    }


    .error {

      background: #ffebee;

      color: #c62828;

    }


    .hidden {

      display: none !important;

    }


    .teacher {

      font-weight: 700;

      color: #1f4e78;

    }


    .tip {

      font-size: 13px;

      line-height: 1.7;

      color: #607d8b;

    }


  </style>

</head>


<body>


<div class="header">

  <h1>
    📷 瑞豐國小 QR Code 掃描
  </h1>

  <p>
    數位積點系統 V1.3
  </p>

</div>


<div class="container">


<!-- 啟動 -->

<div
  id="startPage"
  class="card center">


  <div class="icon">
    📷
  </div>


  <h2>
    學生 QR Code 掃描
  </h2>


  <p>
    請按下方按鈕啟用相機
  </p>


  <div
    id="teacherInfo"
    class="teacher">
  </div>


  <button
    class="primary"
    onclick="startScanner()">

    📷 啟用相機

  </button>


  <button
    class="secondary"
    onclick="backToSystem()">

    ← 返回積點系統

  </button>


  <p class="tip">

    iPhone Chrome 使用 HTTPS 網頁即可使用相機。<br>

    第一次使用時，請選擇「允許」相機權限。

  </p>


</div>


<!-- 掃描 -->

<div
  id="scannerPage"
  class="hidden">


  <div class="card">

    <div
      id="status"
      class="status">

      📷 正在準備相機……

    </div>


    <div id="reader"></div>


    <button
      class="secondary"
      onclick="stopScanner()">

      ⏹ 停止相機

    </button>


    <button
      class="secondary"
      onclick="backToSystem()">

      ← 返回積點系統

    </button>

  </div>


</div>


<!-- 成功 -->

<div
  id="successPage"
  class="hidden">


  <div class="card center">


    <div class="icon">
      ✅
    </div>


    <h2>
      掃描成功！
    </h2>


    <p>
      正在回到數位積點系統……
    </p>


    <button
      class="primary"
      onclick="returnToSystem()">

      返回積點系統

    </button>


  </div>


</div>


</div>


<script>


let scanner = null;

let scanning = false;

let scanned = false;


const params =
  new URLSearchParams(
    window.location.search
  );


const teacherId =
  params.get('teacher') || '';


const callbackUrl =
  params.get('callback') || '';


/*************************************************
 * 顯示教師
 *************************************************/

if (teacherId) {

  document
    .getElementById(
      'teacherInfo'
    )
    .innerText =
    '👨‍🏫 教師掃描模式';

}


/*************************************************
 * 建立回傳網址
 *************************************************/

function buildCallbackUrl(
  qr
) {

  if (!callbackUrl) {

    return '';

  }


  try {

    const url =
      new URL(
        callbackUrl
      );


    url.searchParams.set(
      'teacher',
      teacherId
    );


    url.searchParams.set(
      'qr',
      qr
    );


    return url.toString();

  } catch (error) {

    return '';

  }

}


/*************************************************
 * 啟動相機
 *************************************************/

async function startScanner() {

  if (scanning) {

    return;

  }


  if (!teacherId) {

    showError(
      '缺少教師資訊，請從教師積點系統重新開啟掃描器。'
    );

    return;

  }


  if (!callbackUrl) {

    showError(
      '缺少回傳網址，請確認 Google Apps Script V1.3 設定。'
    );

    return;

  }


  scanned = false;


  document
    .getElementById(
      'startPage'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'scannerPage'
    )
    .classList
    .remove('hidden');


  setStatus(
    '📷 正在啟動 iPhone 相機……'
  );


  try {

    scanner =
      new Html5Qrcode(
        'reader'
      );


    /*
     * 優先使用後置相機
     */

    const config = {

      fps: 10,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.min(
            viewfinderWidth,
            viewfinderHeight
          ) * 0.72;

        return {
          width: Math.floor(size),
          height: Math.floor(size)
        };

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    await scanner.start(

      {
        facingMode: {
          exact: 'environment'
        }
      },

      config,

      onScanSuccess,

      onScanFailure

    );


    scanning = true;


    setStatus(
      '📷 請將學生 QR Code 放入框內'
    );


  } catch (error) {

    console.error(
      error
    );


    /*
     * 如果 exact environment
     * 不成功，再嘗試一般 environment
     */

    try {

      if (scanner) {

        await scanner.clear();

      }

      scanner =
        new Html5Qrcode(
          'reader'
        );


      await scanner.start(

        {
          facingMode: 'environment'
        },

        config,

        onScanSuccess,

        onScanFailure

      );


      scanning = true;


      setStatus(
        '📷 請將學生 QR Code 放入框內'
      );


    } catch (error2) {

      console.error(
        error2
      );


      showError(
        getCameraErrorMessage(
          error2
        )
      );

    }

  }

}


/*************************************************
 * QR 掃描成功
 *************************************************/

async function onScanSuccess(
  decodedText
) {

  if (scanned) {

    return;

  }


  if (!decodedText) {

    return;

  }


  scanned = true;


  setStatus(
    '✅ 掃描成功，正在處理……'
  );


  await stopScanner();


  const target =
    buildCallbackUrl(
      decodedText.trim()
    );


  if (!target) {

    showError(
      '無法建立回傳網址。'
    );

    return;

  }


  document
    .getElementById(
      'scannerPage'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'successPage'
    )
    .classList
    .remove('hidden');


  /*
   * 稍微停留，讓使用者看到成功畫面
   */

  setTimeout(
    function() {

      window.location.href =
        target;

    },
    500
  );

}


/*************************************************
 * 掃描失敗
 *************************************************/

function onScanFailure(
  errorMessage
) {

  /*
   * 正常掃描中會大量觸發
   * 不需要顯示錯誤
   */

}


/*************************************************
 * 停止相機
 *************************************************/

async function stopScanner() {

  if (!scanner) {

    scanning = false;

    return;

  }


  try {

    if (scanning) {

      await scanner.stop();

    }

  } catch (error) {

    console.log(
      error
    );

  }


  try {

    await scanner.clear();

  } catch (error) {

    console.log(
      error
    );

  }


  scanner = null;

  scanning = false;

}


/*************************************************
 * 回到系統
 *************************************************/

function backToSystem() {

  stopScanner();

  returnToSystem();

}


/*************************************************
 * 返回 Google Apps Script
 *************************************************/

function returnToSystem() {

  if (callbackUrl) {

    window.location.href =
      callbackUrl;

    return;

  }


  window.history.back();

}


/*************************************************
 * 顯示狀態
 *************************************************/

function setStatus(
  message
) {

  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status';


  status.innerText =
    message;

}


/*************************************************
 * 顯示錯誤
 *************************************************/

function showError(
  message
) {

  const startPage =
    document.getElementById(
      'startPage'
    );


  const scannerPage =
    document.getElementById(
      'scannerPage'
    );


  startPage
    .classList
    .add('hidden');


  scannerPage
    .classList
    .remove('hidden');


  const status =
    document.getElementById(
      'status'
    );


  status.className =
    'status error';


  status.innerText =
    '⚠️ ' +
    message;

}


/*************************************************
 * 相機錯誤說明
 *************************************************/

function getCameraErrorMessage(
  error
) {

  const message =
    String(
      error &&
      (
        error.message ||
        error.name ||
        error
      )
    );


  if (
    message
      .toLowerCase()
      .indexOf('permission') >= 0
  ) {

    return (
      '相機權限被拒絕。請到 iPhone「設定」→「Chrome」→「相機」，允許 Chrome 使用相機。'
    );

  }


  if (
    message
      .toLowerCase()
      .indexOf('notallowed') >= 0
  ) {

    return (
      'Chrome 沒有相機權限，請到 iPhone「設定」→「Chrome」→「相機」開啟權限。'
    );

  }


  if (
    message
      .toLowerCase()
      .indexOf('notfound') >= 0
  ) {

    return (
      '找不到相機，請確認 iPhone 相機功能正常。'
    );

  }


  if (
    message
      .toLowerCase()
      .indexOf('secure') >= 0
  ) {

    return (
      '目前網頁不是安全 HTTPS 連線，請使用 GitHub Pages 網址。'
    );

  }


  return (
    '無法啟用相機。請確認使用 iPhone Chrome，並允許 Chrome 使用相機。'
  );

}


/*************************************************
 * 離開頁面前停止相機
 *************************************************/

window.addEventListener(
  'pagehide',
  function() {

    stopScanner();

  }
);

</script>

</body>

</html>
