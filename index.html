<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#1f4e78">

<title>瑞豐國小｜QR Code 掃描</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #f4f7fb;
  color: #263238;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
}

.header {
  background: linear-gradient(
    135deg,
    #1f4e78,
    #2e75b6
  );
  color: white;
  text-align: center;
  padding: 20px 16px;
}

.header h1 {
  margin: 0;
  font-size: 23px;
}

.header p {
  margin: 6px 0 0;
  font-size: 13px;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 16px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow:
    0 4px 16px rgba(0,0,0,.08);
}

.center {
  text-align: center;
}

#reader {
  width: 100%;
  max-width: 480px;
  margin: 15px auto;
  overflow: hidden;
  border-radius: 16px;
  background: #000;
}

#reader video {
  width: 100% !important;
  height: auto !important;
  object-fit: cover;
}

button {
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 700;
  margin-top: 10px;
  padding: 12px;
  touch-action: manipulation;
}

.primary {
  background: #1f4e78;
  color: white;
}

.success {
  background: #43a047;
  color: white;
}

.secondary {
  background: #eceff1;
  color: #37474f;
}

.danger {
  background: #d32f2f;
  color: white;
}

.status {
  padding: 12px;
  border-radius: 12px;
  background: #eceff1;
  margin: 10px 0;
  font-size: 14px;
}

.status.success {
  background: #e8f5e9;
  color: #2e7d32;
}

.status.error {
  background: #ffebee;
  color: #c62828;
}

.status.warning {
  background: #fff8e1;
  color: #8d6e00;
}

.student-name {
  font-size: 30px;
  font-weight: 800;
  color: #1f4e78;
}

.student-points {
  font-size: 40px;
  font-weight: 900;
  color: #2e75b6;
  margin: 12px 0;
}

.student-level {
  display: inline-block;
  background: #fff8e1;
  border-radius: 20px;
  padding: 8px 16px;
  font-weight: 700;
}

.hidden {
  display: none !important;
}

.error-text {
  white-space: pre-line;
  line-height: 1.7;
}

</style>

</head>


<body>


<div class="header">

<h1>📷 瑞豐國小 QR Code 掃描</h1>

<p>數位積點系統 V1.4.2</p>

</div>


<div class="container">


<!-- ============================
     掃描頁
============================ -->

<div id="scannerPage">

<div class="card center">

<h2>📱 掃描學生 QR Code</h2>

<p>
請將學生 QR Code 放入掃描框
</p>

<div id="reader"></div>

<div
  id="status"
  class="status">

尚未啟用相機

</div>

<button
  id="startButton"
  class="primary"
  onclick="startScanner()">

📷 啟用相機

</button>

<button
  id="stopButton"
  class="danger hidden"
  onclick="stopScanner()">

⛔ 停止相機

</button>

</div>


<div class="card">

<h3>📌 iPhone Chrome 相機設定</h3>

<p>
如果相機無法使用：
</p>

<p>
① iPhone「設定」
</p>

<p>
② Chrome
</p>

<p>
③ 相機
</p>

<p>
④ 選擇「允許」
</p>

<p>
⑤ 回到 Chrome 重新整理本頁
</p>

</div>

</div>


<!-- ============================
     學生資料
============================ -->

<div
  id="studentPage"
  class="hidden">

<div class="card center">

<div style="font-size:60px;">
👨‍🎓
</div>

<div
  id="studentClass">
</div>

<div
  id="studentName"
  class="student-name">
</div>

<div
  id="studentPoints"
  class="student-points">
</div>

<div
  id="studentLevel"
  class="student-level">
</div>

<button
  class="success"
  onclick="backToGAS()">

⭐ 回到教師積點頁面

</button>

<button
  class="primary"
  onclick="restartScanner()">

📷 掃描下一位

</button>

</div>

</div>


<!-- ============================
     錯誤
============================ -->

<div
  id="errorPage"
  class="hidden">

<div class="card center">

<div style="font-size:60px;">
⚠️
</div>

<h2>
掃描失敗
</h2>

<div
  id="errorMessage"
  class="error-text">
</div>

<button
  class="primary"
  onclick="restartScanner()">

📷 再試一次

</button>

</div>

</div>


</div>


<script>


/*************************************************
 * GAS Web App
 *************************************************/

const GAS_URL =
'https://script.google.com/a/macros/mail.rfes.tyc.edu.tw/s/AKfycbxVyxRnr4i071HzDjXZ43HL_LVbkqZgxWkTgdy8u8_lSwq5H2HsD_Qj-MSwW_spozcE/exec';


/*************************************************
 * 系統變數
 *************************************************/

let scanner = null;

let scanLocked = false;

let teacherId = '';

let scannerToken = '';

let scannedQR = '';

let student = null;


/*************************************************
 * 初始化
 *************************************************/

document.addEventListener(
  'DOMContentLoaded',
  function() {

    const params =
      new URLSearchParams(
        location.search
      );

    teacherId =
      params.get('teacher') || '';

    scannerToken =
      params.get('token') || '';


    if (!teacherId) {

      showError(
        '缺少教師資訊。\n\n請不要直接開啟掃描器，請從教師積點系統進入。'
      );

      return;

    }


    if (!scannerToken) {

      showError(
        '缺少 Scanner Token。\n\n請回到教師積點系統重新開啟掃描器。'
      );

      return;

    }

  }
);


/*************************************************
 * 狀態
 *************************************************/

function setStatus(
  text,
  type
) {

  const el =
    document.getElementById(
      'status'
    );

  el.innerText = text;

  el.className = 'status';

  if (type) {

    el.classList.add(type);

  }

}


/*************************************************
 * 啟動相機
 *************************************************/

async function startScanner() {

  if (scanner) {

    return;

  }


  scanLocked = false;


  setStatus(
    '正在啟用相機……',
    'warning'
  );


  document
    .getElementById(
      'startButton'
    )
    .classList
    .add('hidden');


  try {

    /*
     * 先要求 iPhone Chrome 相機權限
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: 'environment'
            }
          },

          audio: false

        });


    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode: 'environment'
      },

      {

        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.7
            );

          return {

            width: size,

            height: size

          };

        },

        aspectRatio: 1.0,

        disableFlip: false

      },

      onScanSuccess,

      function() {}

    );


    document
      .getElementById(
        'stopButton'
      )
      .classList
      .remove('hidden');


    setStatus(
      '📷 相機已啟動，請掃描學生 QR Code。',
      'success'
    );


  }
  catch(error) {

    console.error(
      error
    );


    scanner = null;


    document
      .getElementById(
        'startButton'
      )
      .classList
      .remove('hidden');


    let msg =
      '無法啟用相機。';


    if (
      error &&
      error.name ===
      'NotAllowedError'
    ) {

      msg =
        '相機權限被拒絕。\n\n請到：\niPhone 設定 → Chrome → 相機 → 開啟';

    }
    else {

      msg +=
        '\n\n' +
        (
          error &&
          error.message
            ? error.message
            : ''
        );

    }


    setStatus(
      msg,
      'error'
    );

  }

}


/*************************************************
 * 掃描成功
 *************************************************/

function onScanSuccess(
  qr
) {

  if (scanLocked) {

    return;

  }


  scanLocked = true;


  scannedQR =
    String(
      qr || ''
    ).trim();


  if (!scannedQR) {

    scanLocked = false;

    return;

  }


  setStatus(
    '✅ QR Code 已讀取，正在查詢學生……',
    'success'
  );


  stopScanner();


  /*
   * JSONP 查詢
   */

  callStudentAPI();

}


/*************************************************
 * JSONP 查詢學生
 *************************************************/

function callStudentAPI() {

  const callbackName =
    'rfStudentCallback_' +
    Date.now();


  window[callbackName] =
    function(result) {

      try {

        if (
          !result ||
          !result.success
        ) {

          showError(
            result &&
            result.message
              ? result.message
              : '找不到學生資料。'
          );

          return;

        }


        student =
          result.student;


        showStudent(
          student
        );


      }
      finally {

        delete
          window[callbackName];

        if (script) {

          script.remove();

        }

      }

    };


  const url =
    GAS_URL +
    '?api=1' +
    '&action=student' +
    '&qr=' +
    encodeURIComponent(
      scannedQR
    ) +
    '&token=' +
    encodeURIComponent(
      scannerToken
    ) +
    '&callback=' +
    encodeURIComponent(
      callbackName
    ) +
    '&_=' +
    Date.now();


  const script =
    document.createElement(
      'script'
    );


  script.src = url;


  script.onerror =
    function() {

      delete
        window[callbackName];


      showError(
        '無法連線到 Google Apps Script。\n\n請確認 GAS Web App 已重新部署，並允許任何人存取。'
      );

    };


  document.body.appendChild(
    script
  );

}


/*************************************************
 * 顯示學生
 *************************************************/

function showStudent(
  data
) {

  hideAll();


  document
    .getElementById(
      'studentPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'studentClass'
    )
    .innerText =
    (
      data.className || ''
    ) +
    '　' +
    (
      data.seatNo || ''
    ) +
    '號';


  document
    .getElementById(
      'studentName'
    )
    .innerText =
    data.name || '';


  document
    .getElementById(
      'studentPoints'
    )
    .innerText =
    (
      data.points || 0
    ) +
    ' 點';


  document
    .getElementById(
      'studentLevel'
    )
    .innerText =
    data.level || '';

}


/*************************************************
 * 回到 GAS
 *************************************************/

function backToGAS() {

  if (!teacherId) {

    alert(
      '缺少教師 ID'
    );

    return;

  }


  if (!scannerToken) {

    alert(
      'Scanner Token 已遺失，請重新登入。'
    );

    return;

  }


  /*
   * 回到 GAS Index
   *
   * action=scanned
   * teacher=教師ID
   * token=Scanner Token
   * qr=學生QR
   */

  const url =
    GAS_URL +
    '?action=scanned' +
    '&teacher=' +
    encodeURIComponent(
      teacherId
    ) +
    '&token=' +
    encodeURIComponent(
      scannerToken
    ) +
    '&qr=' +
    encodeURIComponent(
      scannedQR
    );


  location.href =
    url;

}


/*************************************************
 * 停止相機
 *************************************************/

async function stopScanner() {

  if (!scanner) {

    return;

  }


  try {

    await scanner.stop();

  }
  catch(e) {

    console.warn(e);

  }


  try {

    scanner.clear();

  }
  catch(e) {

    console.warn(e);

  }


  scanner = null;


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'startButton'
    )
    .classList
    .remove('hidden');

}


/*************************************************
 * 重新掃描
 *************************************************/

function restartScanner() {

  scannedQR = '';

  student = null;

  scanLocked = false;


  hideAll();


  document
    .getElementById(
      'scannerPage'
    )
    .classList
    .remove('hidden');


  setStatus(
    '準備重新啟動相機……',
    'warning'
  );


  setTimeout(
    function() {

      startScanner();

    },
    500
  );

}


/*************************************************
 * 錯誤
 *************************************************/

function showError(
  message
) {

  hideAll();


  document
    .getElementById(
      'errorPage'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'errorMessage'
    )
    .innerText =
    message;

}


/*************************************************
 * 隱藏頁面
 *************************************************/

function hideAll() {

  [
    'scannerPage',
    'studentPage',
    'errorPage'
  ]

  .forEach(
    function(id) {

      document
        .getElementById(id)
        .classList
        .add('hidden');

    }
  );

}


/*************************************************
 * 離開頁面
 *************************************************/

window.addEventListener(
  'beforeunload',
  function() {

    if (scanner) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);


</script>

</body>

</html>
