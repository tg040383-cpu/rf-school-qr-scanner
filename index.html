<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
viewport-fit=cover">

<meta
name="theme-color"
content="#1f4e78">

<title>
瑞豐國小｜QR Code 掃描
</title>


<style>

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  background: #f4f7fb;
  color: #263238;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
}

body {
  min-height: 100vh;
}

.header {
  background:
    linear-gradient(
      135deg,
      #1f4e78,
      #2e75b6
    );
  color: white;
  text-align: center;
  padding:
    calc(18px + env(safe-area-inset-top))
    16px
    18px;
}

.header h1 {
  margin: 0;
  font-size: 23px;
}

.header p {
  margin: 6px 0 0;
  font-size: 13px;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow:
    0 4px 18px rgba(0,0,0,.08);
}

.center {
  text-align: center;
}

#cameraBox {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #111;
  border-radius: 18px;
  overflow: hidden;
}

#video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

#scanCanvas {
  display: none;
}

.scanFrame {
  position: absolute;
  left: 15%;
  top: 15%;
  width: 70%;
  height: 70%;
  border:
    3px solid rgba(255,255,255,.9);
  border-radius: 20px;
  box-shadow:
    0 0 0 9999px rgba(0,0,0,.22);
  pointer-events: none;
}

.scanLine {
  position: absolute;
  left: 15%;
  width: 70%;
  height: 3px;
  background: #00e676;
  top: 50%;
  animation:
    scanMove 1.8s infinite ease-in-out;
}

@keyframes scanMove {

  0% {
    top: 25%;
  }

  50% {
    top: 70%;
  }

  100% {
    top: 25%;
  }

}

button {
  width: 100%;
  min-height: 54px;
  border: 0;
  border-radius: 14px;
  margin-top: 10px;
  font-size: 17px;
  font-weight: 700;
}

.primary {
  background: #1f4e78;
  color: white;
}

.success {
  background: #43a047;
  color: white;
}

.secondary {
  background: #eceff1;
  color: #37474f;
}

.danger {
  background: #e53935;
  color: white;
}

input,
textarea {
  width: 100%;
  border:
    1px solid #cfd8dc;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  margin-top: 8px;
}

.status {
  margin-top: 12px;
  padding: 12px;
  background: #eef5fa;
  border-radius: 10px;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}

.student-name {
  font-size: 28px;
  font-weight: 800;
}

.points {
  font-size: 42px;
  color: #1f4e78;
  font-weight: 800;
  margin: 12px 0;
}

.categoryGrid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 10px;
}

.category {
  background: white;
  border:
    2px solid #e0e0e0;
}

.reward {
  background: white;
  border:
    2px solid #e0e0e0;
  text-align: left;
  padding: 14px;
  min-height: 68px;
}

.rewardPoints {
  float: right;
  color: #1f4e78;
  font-weight: 800;
}

.big {
  font-size: 50px;
}

.small {
  color: #78909c;
  font-size: 13px;
}

</style>

</head>


<body>


<div class="header">

<h1>
📷 瑞豐國小 QR Scanner
</h1>

<p>
V1.5.1｜iPhone Chrome 穩定版
</p>

</div>


<div class="container">


<!-- 啟動 -->

<div
id="startPage">

<div class="card center">

<div class="big">
📷
</div>

<h2>
學生 QR Code 掃描
</h2>

<p>
請按下「啟動相機」
</p>

<div
id="connectionStatus"
class="status">

正在檢查系統…

</div>

<button
class="primary"
onclick="startCamera()">

📷 啟動相機

</button>

<button
class="secondary"
onclick="manualInput()">

⌨️ 手動輸入 QR ID

</button>

</div>

</div>


<!-- 相機 -->

<div
id="cameraPage"
class="hidden">

<div class="card">

<div id="cameraBox">

<video
id="video"
autoplay
playsinline
muted>
</video>

<div class="scanFrame"></div>

<div class="scanLine"></div>

</div>

<canvas
id="scanCanvas">
</canvas>

<p
id="scanStatus"
class="status center">

正在啟動相機…

</p>

<button
class="secondary"
onclick="stopCamera()">

⏹ 停止相機

</button>

</div>

</div>


<!-- 手動 -->

<div
id="manualPage"
class="hidden">

<div class="card">

<h2>
⌨️ 手動輸入 QR ID
</h2>

<p>
如果相機無法使用，可以直接輸入學生 QR_ID。
</p>

<input
id="manualQR"
placeholder="例如：S001">

<button
class="primary"
onclick="searchManualQR()">

🔍 查詢學生

</button>

<button
class="secondary"
onclick="backStart()">

← 返回

</button>

</div>

</div>


<!-- 學生 -->

<div
id="studentPage"
class="hidden">

<div class="card center">

<div id="studentClass"></div>

<div
id="studentName"
class="student-name">
</div>

<div
id="studentPoints"
class="points">
</div>

<div id="studentLevel"></div>

<button
class="primary"
onclick="showCategories()">

⭐ 開始給點

</button>

<button
class="secondary"
onclick="restartScan()">

📷 再掃一位學生

</button>

</div>

</div>


<!-- 類別 -->

<div
id="categoryPage"
class="hidden">

<div class="card">

<h2>
⭐ 選擇獎勵類別
</h2>

<p id="categoryStudent"></p>

<div
id="categoryGrid"
class="categoryGrid">
</div>

<button
class="secondary"
onclick="showStudent()">

← 返回

</button>

</div>

</div>


<!-- 獎勵 -->

<div
id="rewardPage"
class="hidden">

<div class="card">

<h2 id="rewardTitle">
選擇獎勵
</h2>

<div id="rewardList"></div>

<button
class="secondary"
onclick="showCategories()">

← 返回

</button>

</div>

</div>


<!-- 確認 -->

<div
id="confirmPage"
class="hidden">

<div class="card center">

<h2>
確認給點
</h2>

<div
id="confirmStudent"
class="student-name">
</div>

<p id="confirmReward"></p>

<div
id="confirmPoints"
class="points">
</div>

<textarea
id="remark"
placeholder="備註（選填）">
</textarea>

<button
id="submitButton"
class="success"
onclick="submitPoint()">

✓ 確認送出

</button>

<button
class="secondary"
onclick="showRewards()">

取消

</button>

</div>

</div>


<!-- 成功 -->

<div
id="successPage"
class="hidden">

<div class="card center">

<div class="big">
🎉
</div>

<h2>
加點成功！
</h2>

<div
id="successStudent"
class="student-name">
</div>

<div
id="successAdd"
class="points">
</div>

<p>
目前累積
</p>

<div
id="successTotal"
class="points">
</div>

<p id="successLevel"></p>

<button
class="primary"
onclick="restartScan()">

📷 繼續掃描

</button>

</div>

</div>


</div>


<!-- QR Code 掃描函式庫 -->

<script
src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js">
</script>


<script>

/*************************************************
 * GAS API
 *************************************************/

const GAS_API =
'https://script.google.com/a/macros/mail.rfes.tyc.edu.tw/s/AKfycbxVyxRnr4i071HzDjXZ43HL_LVbkqZgxWkTgdy8u8_lSwq5H2HsD_Qj-MSwW_spozcE/exec';


/*************************************************
 * 狀態
 *************************************************/

let teacherId = '';
let token = '';

let video = null;
let canvas = null;
let ctx = null;

let stream = null;
let scanning = false;

let student = null;
let rewardItems = [];
let selectedReward = null;


/*************************************************
 * 頁面初始化
 *************************************************/

document.addEventListener(
'DOMContentLoaded',
function(){

const params =
new URLSearchParams(
window.location.search
);

teacherId =
params.get('teacher') || '';

token =
params.get('token') || '';


if (!teacherId || !token) {

showConnection(
'❌ 缺少教師 Scanner Token。<br>請從教師積點系統重新開啟掃描器。',
true
);

return;

}


checkConnection();

});


/*************************************************
 * GAS 連線測試
 *************************************************/

function checkConnection() {

showConnection(
'🔄 正在連線 Google Apps Script…'
);


jsonp(
'action=ping',
function(result){

if (
result &&
result.success
) {

showConnection(
'✅ Google Apps Script 連線正常<br>' +
'系統版本：' +
result.version
);

} else {

showConnection(
'❌ Google Apps Script 回應失敗<br>' +
(result.message || ''),
true
);

}

},
function(error){

showConnection(
'❌ 無法連線至 Google Apps Script<br><br>' +
escapeHtml(error),
true
);

});

}


/*************************************************
 * JSONP
 *************************************************/

function jsonp(
params,
success,
failure
) {

const callbackName =
'RFQR_' +
Date.now() +
'_' +
Math.floor(
Math.random() * 100000
);


const script =
document.createElement('script');


const timeout =
setTimeout(
function(){

cleanup();

if (failure) {

failure(
'Google Apps Script 連線逾時'
);

}

},
15000
);


function cleanup() {

clearTimeout(timeout);

try {

delete window[callbackName];

} catch(e) {

window[callbackName] =
undefined;

}

if (
script.parentNode
) {

script.parentNode
.removeChild(script);

}

}


window[callbackName] =
function(data){

cleanup();

if (success) {

success(data);

}

};


script.onerror =
function(){

cleanup();

if (failure) {

failure(
'無法載入 Google Apps Script API'
);

}

};


script.src =
GAS_API +
'?api=1&' +
params +
'&callback=' +
callbackName +
'&_=' +
Date.now();


document
.head
.appendChild(script);

}


/*************************************************
 * 顯示連線
 *************************************************/

function showConnection(
message,
error
) {

const box =
document
.getElementById(
'connectionStatus'
);


box.innerHTML =
message;


if (error) {

box.style.background =
'#ffebee';

box.style.color =
'#c62828';

}

}


/*************************************************
 * 啟動相機
 *************************************************/

async function startCamera() {

if (
!window.isSecureContext
) {

alert(
'目前不是安全 HTTPS 網頁，iPhone 無法使用相機。'
);

return;

}


if (
!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia
) {

alert(
'目前瀏覽器不支援相機功能。請使用最新版 iPhone Chrome。'
);

return;

}


try {

stopCamera();


showPage(
'cameraPage'
);


document
.getElementById(
'scanStatus'
)
.innerText =
'正在要求相機權限…';


/*
 * iPhone Chrome
 * 使用後置鏡頭
 */

stream =
await navigator.mediaDevices.getUserMedia({

video: {

facingMode: {
ideal: 'environment'
},

width: {
ideal: 1280
},

height: {
ideal: 720
}

},

audio: false

});


video =
document.getElementById(
'video'
);


canvas =
document.getElementById(
'scanCanvas'
);


ctx =
canvas.getContext(
'2d',
{
willReadFrequently: true
}
);


video.srcObject =
stream;


await video.play();


scanning = true;


document
.getElementById(
'scanStatus'
)
.innerText =
'📷 相機已啟動，請將學生 QR Code 放入框內';


scanLoop();


} catch(error) {

console.error(error);

stopCamera();


showPage(
'startPage'
);


let message =
'❌ 相機無法啟用。';


if (
error.name ===
'NotAllowedError'
) {

message +=
'\n\n請到 iPhone：\n' +
'設定 → Chrome → 相機 → 開啟';

} else if (
error.name ===
'NotFoundError'
) {

message +=
'\n\n找不到可用的相機。';

} else if (
error.name ===
'SecurityError'
) {

message +=
'\n\n瀏覽器安全性限制。請確認網址是 HTTPS。';

} else {

message +=
'\n\n' +
(error.message || error.name);

}


alert(message);

}

}


/*************************************************
 * QR 掃描
 *************************************************/

function scanLoop() {

if (!scanning) {

return;

}


if (
video.readyState >=
video.HAVE_ENOUGH_DATA
) {

const width =
video.videoWidth;


const height =
video.videoHeight;


if (
width > 0 &&
height > 0
) {

canvas.width =
width;

canvas.height =
height;


ctx.drawImage(
video,
0,
0,
width,
height
);


const imageData =
ctx.getImageData(
0,
0,
width,
height
);


const code =
jsQR(
imageData.data,
width,
height,
{
inversionAttempts:
'attemptBoth'
}
);


if (
code &&
code.data
) {

scanning = false;

const qr =
String(
code.data
).trim();


document
.getElementById(
'scanStatus'
)
.innerText =
'✅ 掃描成功，正在查詢學生…';


stopCamera();


lookupStudent(qr);

return;

}

}

}


requestAnimationFrame(
scanLoop
);

}


/*************************************************
 * 停止相機
 *************************************************/

function stopCamera() {

scanning = false;


if (stream) {

stream
.getTracks()
.forEach(
function(track){

track.stop();

}
);

stream = null;

}


if (video) {

try {

video.srcObject =
null;

} catch(e) {}

}

}


/*************************************************
 * 手動輸入
 *************************************************/

function manualInput() {

stopCamera();

showPage(
'manualPage'
);


document
.getElementById(
'manualQR'
)
.focus();

}


/*************************************************
 * 手動查詢
 *************************************************/

function searchManualQR() {

const qr =
document
.getElementById(
'manualQR'
)
.value
.trim();


if (!qr) {

alert(
'請輸入 QR_ID'
);

return;

}


lookupStudent(qr);

}


/*************************************************
 * 查學生
 *************************************************/

function lookupStudent(qr) {

showPage(
'studentPage'
);


document
.getElementById(
'studentName'
)
.innerText =
'查詢中…';


jsonp(

'action=student' +
'&qr=' +
encodeURIComponent(qr) +
'&token=' +
encodeURIComponent(token),

function(result){

if (
!result ||
!result.success
) {

alert(
result &&
result.message
?
result.message
:
'查詢學生失敗'
);

restartScan();

return;

}


student =
result.student;


showStudent();

},

function(error){

alert(
'無法連線 Google Apps Script：\n' +
error
);

restartScan();

});

}


/*************************************************
 * 顯示學生
 *************************************************/

function showStudent() {

showPage(
'studentPage'
);


document
.getElementById(
'studentClass'
)
.innerText =
student.className +
'　' +
student.seatNo +
'號';


document
.getElementById(
'studentName'
)
.innerText =
student.name;


document
.getElementById(
'studentPoints'
)
.innerText =
student.points +
' 點';


document
.getElementById(
'studentLevel'
)
.innerText =
student.level;

}


/*************************************************
 * 類別
 *************************************************/

function showCategories() {

if (!student) {

return;

}


showPage(
'categoryPage'
);


document
.getElementById(
'categoryStudent'
)
.innerText =
student.className +
'　' +
student.name;


if (
!rewardItems.length
) {

loadRewards(
function(){

renderCategories();

}
);

return;

}


renderCategories();

}


/*************************************************
 * 載入獎勵
 *************************************************/

function loadRewards(
done
) {

jsonp(

'action=rewards' +
'&token=' +
encodeURIComponent(token),

function(result){

if (
!result ||
!result.success
) {

alert(
result &&
result.message
?
result.message
:
'無法取得獎勵資料'
);

return;

}


rewardItems =
result.rewards ||
[];


if (done) {

done();

}

},

function(error){

alert(
'無法連線 Google Apps Script：\n' +
error
);

});

}


/*************************************************
 * 類別畫面
 *************************************************/

function renderCategories() {

const categories =
[
...new Set(
rewardItems.map(
item => item.category
)
)
];


const icons = {

'品德':'🌱',
'學習':'📚',
'服務':'🤝',
'整潔':'🧹',
'安全':'🛡️',
'榮譽':'🏆'

};


const grid =
document
.getElementById(
'categoryGrid'
);


grid.innerHTML = '';


categories.forEach(
function(category){

const button =
document.createElement(
'button'
);


button.className =
'category';


button.innerHTML =
(icons[category] || '⭐') +
'<br>' +
escapeHtml(
category
);


button.onclick =
function(){

showRewards(
category
);

};


grid.appendChild(
button
);

});

}


/*************************************************
 * 獎勵
 *************************************************/

function showRewards(
category
) {

showPage(
'rewardPage'
);


document
.getElementById(
'rewardTitle'
)
.innerText =
category +
'｜選擇行為';


const list =
document
.getElementById(
'rewardList'
);


list.innerHTML = '';


rewardItems

.filter(
function(item){

return (
item.category ===
category
);

})

.forEach(
function(item){

const button =
document.createElement(
'button'
);


button.className =
'reward';


button.innerHTML =

'<span class="rewardPoints">' +
'+' +
item.points +
'</span>' +

'<strong>' +
escapeHtml(
item.name
) +
'</strong>' +

'<br>' +

'<small>' +
escapeHtml(
item.description || ''
) +
'</small>';


button.onclick =
function(){

selectReward(
item
);

};


list.appendChild(
button
);

});

}


/*************************************************
 * 選獎勵
 *************************************************/

function selectReward(
item
) {

selectedReward =
item;


showPage(
'confirmPage'
);


document
.getElementById(
'confirmStudent'
)
.innerText =
student.name;


document
.getElementById(
'confirmReward'
)
.innerText =
item.name;


document
.getElementById(
'confirmPoints'
)
.innerText =
'+' +
item.points +
' 點';


document
.getElementById(
'remark'
)
.value = '';

}


/*************************************************
 * 返回獎勵
 *************************************************/

function showRewards() {

if (
selectedReward
) {

showRewards(
selectedReward.category
);

}

}


/*************************************************
 * 加點
 *************************************************/

function submitPoint() {

if (
!student ||
!selectedReward ||
!token
) {

alert(
'資料不完整，請重新掃描。'
);

return;

}


const button =
document
.getElementById(
'submitButton'
);


button.disabled = true;

button.innerText =
'送出中…';


const remark =
document
.getElementById(
'remark'
)
.value
.trim();


const params =

'action=addPoint' +

'&studentId=' +
encodeURIComponent(
student.id
) +

'&rewardId=' +
encodeURIComponent(
selectedReward.id
) +

'&remark=' +
encodeURIComponent(
remark
) +

'&token=' +
encodeURIComponent(
token
);


jsonp(
params,

function(result){

button.disabled = false;

button.innerText =
'✓ 確認送出';


if (
!result ||
!result.success
) {

alert(
result &&
result.message
?
result.message
:
'加點失敗'
);

return;

}


document
.getElementById(
'successStudent'
)
.innerText =
result.student.name;


document
.getElementById(
'successAdd'
)
.innerText =
'+' +
result.reward.points +
' 點';


document
.getElementById(
'successTotal'
)
.innerText =
result.totalPoints +
' 點';


document
.getElementById(
'successLevel'
)
.innerText =
result.level;


showPage(
'successPage'
);


student.points =
result.totalPoints;


student.level =
result.level;


},

function(error){

button.disabled = false;

button.innerText =
'✓ 確認送出';


alert(
'無法連線 Google Apps Script：\n' +
error
);

});

}


/*************************************************
 * 重新掃描
 *************************************************/

function restartScan() {

student = null;

selectedReward = null;

showPage(
'startPage'
);


setTimeout(
function(){

startCamera();

},
300
);

}


/*************************************************
 * 返回
 *************************************************/

function backStart() {

stopCamera();

showPage(
'startPage'
);

}


/*************************************************
 * 顯示頁面
 *************************************************/

function showPage(
id
) {

[
'startPage',
'cameraPage',
'manualPage',
'studentPage',
'categoryPage',
'rewardPage',
'confirmPage',
'successPage'

].forEach(
function(page){

document
.getElementById(page)
.classList
.add('hidden');

});


document
.getElementById(id)
.classList
.remove('hidden');

}


/*************************************************
 * HTML Escape
 *************************************************/

function escapeHtml(
value
) {

return String(
value || ''
)

.replace(
/&/g,
'&amp;'
)

.replace(
/</g,
'&lt;'
)

.replace(
/>/g,
'&gt;'
)

.replace(
/"/g,
'&quot;'
)

.replace(
/'/g,
'&#039;'
);

}

</script>
