<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

  <title>
    瑞豐國小｜QR Code 掃描
  </title>


  <!--
    QR Code Scanner
  -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {

      margin: 0;

      padding: 0;

      min-height: 100%;

      background: #f4f7fb;

      color: #263238;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

    }


    body {

      min-height: 100vh;

      padding-bottom:
        env(safe-area-inset-bottom);

    }


    .header {

      background:
        linear-gradient(
          135deg,
          #1f4e78,
          #2e75b6
        );

      color: white;

      padding:
        calc(
          22px +
          env(safe-area-inset-top)
        )
        18px
        22px;

      text-align: center;

    }


    .header h1 {

      margin: 0;

      font-size: 23px;

    }


    .header p {

      margin:
        6px
        0
        0;

      font-size: 13px;

    }


    .container {

      width: 100%;

      max-width: 520px;

      margin: auto;

      padding: 16px;

    }


    .card {

      background: white;

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 16px;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.08);

    }


    .center {

      text-align: center;

    }


    button {

      width: 100%;

      min-height: 54px;

      border: 0;

      border-radius: 14px;

      font-size: 17px;

      font-weight: 700;

      margin-bottom: 12px;

      cursor: pointer;

    }


    button:active {

      transform: scale(.98);

    }


    .primary {

      background: #1f4e78;

      color: white;

    }


    .secondary {

      background: #eceff1;

      color: #37474f;

    }


    .success {

      background: #43a047;

      color: white;

    }


    .danger {

      background: #e53935;

      color: white;

    }


    #reader {

      width: 100%;

      overflow: hidden;

      border-radius: 16px;

      background: #111;

    }


    #reader video {

      width: 100% !important;

      height: auto !important;

      border-radius: 16px;

      object-fit: cover;

    }


    .status {

      padding: 14px;

      background: #eef5fb;

      border-radius: 12px;

      margin-bottom: 15px;

      text-align: center;

      line-height: 1.6;

    }


    .warning {

      background: #fff8e1;

      color: #795548;

    }


    .success-box {

      background: #e8f5e9;

      color: #2e7d32;

      padding: 16px;

      border-radius: 14px;

      text-align: center;

      font-weight: 700;

      margin-bottom: 15px;

    }


    .manual {

      margin-top: 18px;

      border-top:
        1px solid #eee;

      padding-top: 18px;

    }


    input {

      width: 100%;

      padding: 15px;

      border:
        1px solid #cfd8dc;

      border-radius: 12px;

      font-size: 16px;

      margin:
        8px 0
        12px;

    }


    .small {

      color: #78909c;

      font-size: 13px;

      line-height: 1.6;

    }


    .hidden {

      display: none !important;

    }


    .back {

      margin-top: 5px;

    }

  </style>

</head>


<body>


<div class="header">

  <h1>
    📷 瑞豐國小 QR Code
  </h1>

  <p>
    數位積點系統 V1.4
  </p>

</div>


<div class="container">


  <div class="card">


    <div
      id="status"
      class="status">

      準備啟動相機

    </div>


    <!--
      QR Scanner
    -->

    <div
      id="reader">
    </div>


    <br>


    <button
      id="startButton"
      class="primary"
      onclick="startScanner()">

      📷 啟動相機

    </button>


    <button
      id="stopButton"
      class="danger hidden"
      onclick="stopScanner()">

      ⏹ 停止相機

    </button>


    <button
      class="secondary"
      onclick="goBack()">

      ← 返回積點系統

    </button>


    <!--
      手動輸入
    -->

    <div class="manual">

      <strong>
        找不到相機時
      </strong>

      <p class="small">

        如果 iPhone Chrome 無法啟動相機，
        可以直接輸入學生的 QR_ID。

      </p>


      <input
        id="manualQR"
        type="text"
        placeholder="請輸入 QR_ID"
        autocomplete="off">


      <button
        class="secondary"
        onclick="manualSubmit()">

        🔎 手動查詢學生

      </button>

    </div>


  </div>


  <div
    id="successBox"
    class="card hidden">

    <div
      class="success-box">

      ✓ QR Code 掃描成功

    </div>


    <p
      id="resultText"
      class="center">
    </p>


    <button
      class="primary"
      onclick="returnToGAS()">

      ⭐ 前往學生資料

    </button>


    <button
      class="secondary"
      onclick="scanAgain()">

      📷 再掃一次

    </button>

  </div>


</div>


<script>


/*************************************************
 * 取得網址參數
 *************************************************/

const params =
  new URLSearchParams(
    window.location.search
  );


const teacherId =
  params.get(
    'teacher'
  ) || '';


const callbackUrl =
  params.get(
    'callback'
  ) || '';


let scanner = null;

let scannerRunning = false;

let scannedQR = '';

let scanFinished = false;


/*************************************************
 * 初始化
 *************************************************/

document.addEventListener(
  'DOMContentLoaded',
  function() {

    if (!callbackUrl) {

      setStatus(
        'warning',
        '缺少回傳網址，請從瑞豐國小積點系統進入掃描器。'
      );

      document
        .getElementById(
          'startButton'
        )
        .disabled = true;

      return;

    }


    if (!teacherId) {

      setStatus(
        'warning',
        '缺少教師資料，請回到積點系統重新登入。'
      );

      return;

    }


    /*
     * 不要一進頁面就開相機。
     *
     * iPhone Chrome 必須由使用者操作
     * 才啟動 getUserMedia。
     */

    setStatus(
      '',
      '請按「啟動相機」，允許 Chrome 使用相機。'
    );

  }
);


/*************************************************
 * 狀態
 *************************************************/

function setStatus(
  type,
  message
) {

  const el =
    document.getElementById(
      'status'
    );


  el.className =
    'status';


  if (type === 'warning') {

    el.classList.add(
      'warning'
    );

  }


  el.innerText =
    message;

}


/*************************************************
 * 啟動掃描器
 *************************************************/

async function startScanner() {

  if (scannerRunning) {

    return;

  }


  if (!window.isSecureContext) {

    setStatus(
      'warning',
      '目前不是 HTTPS 安全環境，因此無法使用 iPhone 相機。'
    );

    return;

  }


  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    setStatus(
      'warning',
      '此瀏覽器不支援相機功能，請使用最新版 iPhone Chrome。'
    );

    return;

  }


  scanFinished = false;


  document
    .getElementById(
      'startButton'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .remove('hidden');


  setStatus(
    '',
    '正在啟動相機，請稍候…'
  );


  try {

    /*
     * 先主動要求相機權限。
     *
     * facingMode environment
     * = iPhone 後鏡頭
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          video: {
            facingMode: {
              ideal: 'environment'
            }
          },
          audio: false
        });


    /*
     * 立即關掉測試 stream。
     *
     * html5-qrcode 稍後會自己重新開啟。
     */

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );


    scanner =
      new Html5Qrcode(
        'reader'
      );


    await scanner.start(

      {
        facingMode:
          'environment'
      },


      {
        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.72
            );


          return {

            width:
              size,

            height:
              size

          };

        },

        aspectRatio:
          1.0

      },


      onScanSuccess,


      onScanFailure

    );


    scannerRunning =
      true;


    setStatus(
      '',
      '📷 相機已啟動，請將學生 QR Code 對準框框。'
    );

  }
  catch (error) {

    console.error(
      error
    );


    scannerRunning =
      false;


    document
      .getElementById(
        'startButton'
      )
      .classList
      .remove('hidden');


    document
      .getElementById(
        'stopButton'
      )
      .classList
      .add('hidden');


    let message =
      '相機無法啟用。';


    if (
      error &&
      error.name ===
      'NotAllowedError'
    ) {

      message =
        'Chrome 沒有相機權限。請到 iPhone「設定 → Chrome → 相機」開啟。';

    }
    else if (
      error &&
      error.name ===
      'NotFoundError'
    ) {

      message =
        '找不到相機，請確認 iPhone 相機正常。';

    }
    else if (
      error &&
      error.name ===
      'NotReadableError'
    ) {

      message =
        '相機目前被其他 App 使用，請關閉其他使用相機的 App 後再試。';

    }
    else if (
      error &&
      error.name ===
      'SecurityError'
    ) {

      message =
        '瀏覽器安全性限制了相機，請確認網址是 HTTPS。';

    }
    else if (
      error &&
      error.name ===
      'OverconstrainedError'
    ) {

      message =
        '後鏡頭無法使用，請重新啟動相機。';

    }
    else {

      message +=
        '\n' +
        (
          error &&
          error.message
            ? error.message
            : ''
        );

    }


    setStatus(
      'warning',
      message
    );

  }

}


/*************************************************
 * QR 成功
 *************************************************/

function onScanSuccess(
  decodedText,
  decodedResult
) {

  if (scanFinished) {

    return;

  }


  scanFinished =
    true;


  scannedQR =
    String(
      decodedText || ''
    ).trim();


  if (!scannedQR) {

    scanFinished =
      false;

    return;

  }


  setStatus(
    '',
    '✓ 掃描成功，正在處理…'
  );


  stopScanner();


  document
    .getElementById(
      'successBox'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'resultText'
    )
    .innerText =
    'QR_ID：' +
    scannedQR;

}


/*************************************************
 * 掃描失敗
 *
 * 不要一直顯示錯誤，
 * 因為找不到 QR 是正常狀況。
 *************************************************/

function onScanFailure(
  error
) {

  // 故意不顯示。
  // html5-qrcode 掃不到 QR 時會持續呼叫這裡。

}


/*************************************************
 * 停止相機
 *************************************************/

async function stopScanner() {

  try {

    if (
      scanner &&
      scannerRunning
    ) {

      await scanner.stop();

    }

  }
  catch (error) {

    console.log(
      error
    );

  }


  try {

    if (scanner) {

      await scanner.clear();

    }

  }
  catch (error) {

    console.log(
      error
    );

  }


  scannerRunning =
    false;


  document
    .getElementById(
      'stopButton'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'startButton'
    )
    .classList
    .remove('hidden');

}


/*************************************************
 * 再掃一次
 *************************************************/

function scanAgain() {

  scannedQR =
    '';

  scanFinished =
    false;


  document
    .getElementById(
      'successBox'
    )
    .classList
    .add('hidden');


  setStatus(
    '',
    '請按「啟動相機」重新掃描。'
  );


  window.scrollTo(
    0,
    0
  );

}


/*************************************************
 * 回 GAS
 *************************************************/

function returnToGAS() {

  if (
    !callbackUrl ||
    !scannedQR
  ) {

    alert(
      '缺少掃描資料。'
    );

    return;

  }


  /*
   * 完全使用瀏覽器導向。
   *
   * 不使用 fetch。
   * 不使用 XMLHttpRequest。
   * 不使用 JSONP。
   *
   * 因此不會有 CORS 問題。
   */

  const url =
    callbackUrl +
    (
      callbackUrl.indexOf('?') >= 0
        ? '&'
        : '?'
    ) +
    'teacher=' +
    encodeURIComponent(
      teacherId
    ) +
    '&qr=' +
    encodeURIComponent(
      scannedQR
    );


  window.location.href =
    url;

}


/*************************************************
 * 手動 QR_ID
 *************************************************/

function manualSubmit() {

  const input =
    document
      .getElementById(
        'manualQR'
      );


  const qr =
    input
      .value
      .trim();


  if (!qr) {

    alert(
      '請輸入 QR_ID'
    );

    return;

  }


  scannedQR =
    qr;


  scanFinished =
    true;


  document
    .getElementById(
      'successBox'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'resultText'
    )
    .innerText =
    'QR_ID：' +
    qr;


  window.scrollTo(
    0,
    0
  );

}


/*************************************************
 * 返回 GAS
 *************************************************/

function goBack() {

  if (callbackUrl) {

    window.location.href =
      callbackUrl;

  }
  else {

    history.back();

  }

}

</script>

</body>

</html>
